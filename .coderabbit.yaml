# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json

# CodeRabbit configuration. The GitHub App reads this on every PR.
# Docs: https://docs.coderabbit.ai/configuration/
#
# Goal: a discreet reviewer that only reports defects. No summary, no
# walkthrough decoration, no status chatter. AGENTS.md is read as code
# guidelines by default (knowledge_base.code_guidelines), so the project
# conventions are not repeated here.

language: en-US

# Max 250 characters.
tone_instructions: |
  Report only defects: bugs, security or availability risks, spec
  violations, missing tests or docs for a behaviour change. No praise, no
  style remarks, no restating the diff. One or two sentences per comment.

chat:
  # Answer only when mentioned with "@coderabbitai".
  auto_reply: false
  art: false

reviews:
  # 'quiet' posts only the most important findings inline and folds the
  # rest; 'chill' and 'assertive' add progressively more nitpicks.
  profile: quiet

  # Don't request changes on the PR: merge gating stays with humans + CI.
  request_changes_workflow: false

  # Never touch the PR description, and keep the walkthrough comment down
  # to the findings. "@coderabbitai summary" in a description still asks
  # for a summary on demand.
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  # Drops the "Prompt for AI agents" block appended to every comment.
  enable_prompt_for_ai_agents: false
  # No "review skipped" comments (draft PRs, too many files...).
  review_status: false
  review_details: false

  # One review when a PR is opened, or when a draft is marked ready for
  # review. Later pushes are not reviewed: comment "@coderabbitai review"
  # to get an incremental review of the new commits. CodeRabbit has no
  # time-based throttle, so this is the only way to avoid one review per
  # push.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    # Dependency bumps and release commits are mechanical.
    ignore_title_keywords:
      - "build(deps):"
      - "ci(deps):"
      - "chore(deps):"
      - "chore(release):"

  # The title and commit style are enforced by conform; the description is
  # the author's. Docstrings are not a project convention.
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Already run by CI and lefthook: CodeRabbit would repeat their findings.
  # golangci-lint is a custom build (.custom-gcl.yml) CodeRabbit cannot
  # reproduce anyway. LanguageTool only produces prose nitpicks.
  tools:
    golangci-lint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  # Generated files: the source of truth is elsewhere. This is the
  # "Generated, never edit by hand" set of AGENTS.md, plus lockfiles.
  path_filters:
    - "!**/zz_generated.*.go"
    - "!config/crd/bases/**"
    - "!config/rbac/role.yaml"
    - "!config/webhook/manifests.yaml"
    - "!helm/kube-image-keeper/crds/**"
    - "!helm/kube-image-keeper/files/**"
    - "!cover.out"
    - "!go.sum"
    - "!**/package-lock.json"

  # Per-path guidance fed to the model alongside the diff. Keep these
  # short and load-bearing: long instructions get diluted. docs/v3 is the
  # specification; flag code that contradicts it.
  path_instructions:
    - path: "internal/webhook/**/*.go"
      instructions: |
        Mutating Pod webhook, in the admission path of every Pod
        (docs/v3/architecture.md, "The admission path"). Flag anything that
        breaks these invariants:
        - Fail open: never deny or error an admission; on any failure, admit
          the Pod unchanged. No panic path.
        - Read-only: the returned patch is the only write. No API call that
          writes, no Event, no status, no informer on Pods.
        - Every registry probe is bounded by availabilityCheck.timeout.
        - Idempotent under reinvocation: a container whose image equals the
          rewrittenTo of kuik.enix.io/rewrites is never rewritten again, and
          no-alternatives entries are never resolved twice.
        - Never rewrite imagePullPolicy: Never containers or static (mirror)
          Pods. initContainers are routed, ephemeralContainers are not.

    - path: "cmd/**/*.go"
      instructions: |
        One subcommand per process: webhook, reconciler, secret-syncer
        (docs/v3/architecture.md). Flag a reconciler registered in the
        webhook process, leader election on the webhook, or a lease shared
        between the reconciler and the secret syncer.

    - path: "internal/controller/**/*.go"
      instructions: |
        Reconcilers. Flag hot loops, transient errors not requeued, status
        written without re-reading the object, and registry calls that
        bypass the per-host check and copy windows (docs/v3/spec.md,
        "Scheduling"). Status reasons must match docs/v3/status.md.

    - path: "internal/registry/**/*.go"
      instructions: |
        Registry access. Flag logged credentials, unchecked input, and any
        error misclassified as another availability status: the status
        drives routing and failover.

    - path: "api/kuik/v1alpha1/**/*.go"
      instructions: |
        CRD types. Flag removed or renamed fields (breaking), fields missing
        validation markers, and changes not reflected in docs/crds.md.

    - path: "helm/kube-image-keeper/**"
      instructions: |
        Flag changes that break an upgrade from the previous chart version
        (renamed or removed values, changed selector labels) and RBAC wider
        than the process needs: the webhook is read-only, only the secret
        syncer writes Secrets. A new value needs a "# --" comment in
        values.yaml: the chart README is generated from them.

    - path: ".github/workflows/**"
      instructions: |
        Flag missing permissions blocks and GITHUB_TOKEN scopes wider than
        the job needs. Actions are pinned to major tags on purpose and
        bumped by Dependabot; don't ask for SHA pinning.

    - path: "docs/**/*.md"
      instructions: |
        Rendered on GitHub and on kuik.enix.io; the build converts GitHub
        syntax for Starlight. Flag ":::note" directives (the right form is
        a GitHub alert, "> [!NOTE]"), site routes like "/crds/" (the right
        form is a relative link, "./crds.md"), and a missing leading H1 or
        frontmatter description.
