                        properties:
                          digest:
                            description: digest running in the cluster.
                            type: string
                          pods:
                            description: pods counts the pods running it.
                            format: int32
                            type: integer
                        required:
                        - digest
                        - pods
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                      - digest
                      x-kubernetes-list-type: map
                    since:
                      description: since is when the drift was first observed. Stamped
                        once, never refreshed.
                      format: date-time
                      type: string
                    upstreamDigest:
                      description: upstreamDigest is the digest the upstream tag points
                        at now.
                      type: string
                  required:
                  - ref
                  - runningDigests
                  - since
                  - upstreamDigest
                  type: object
                type: array
                x-kubernetes-list-type: atomic
