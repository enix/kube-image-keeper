                type: object
              unavailableAlternatives:
                description: |-
                  unavailableAlternatives lists the monitored alternatives whose last check failed.
                  Capped, see ListCapacityPressure.
                items:
                  description: UnavailableAlternative is a monitored alternative whose
                    last check failed.
                  properties:
                    derivedFrom:
                      description: derivedFrom is the origin it stands for.
                      type: string
                    reason:
                      description: reason is what the check observed.
