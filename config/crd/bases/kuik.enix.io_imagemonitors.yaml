                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              unusedImageRetention:
                default: 168h
                description: |-
                  unusedImageRetention keeps monitoring an image for this long after no pod declares it
                  any more, so that a CronJob's image stays checked between runs.
                pattern: ^(0|([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+)$
                type: string
            type: object
          status:
            description: status defines the observed state of ImageMonitor
            properties:
              checks:
                description: checks is the health of the check schedule, one ring
                  per registry host.
                properties:
                  registries:
                    description: registries holds one ring per source host. A mirror
                      destination never appears here.
                    items:
                      description: RegistryCheck is the health of the check schedule
                        of one (resource, registry host) ring.
                      properties:
                        cursor:
                          description: cursor is the last reference checked; the ring
                            resumes at its successor on restart.
                          type: string
                        cycleDuration:
                          description: |-
                            cycleDuration is the measured duration of the last completed lap, hence how often each
                            image of this host comes back. Absent until a first lap completes.
                          type: string
                        cycleStarted:
                          description: cycleStarted is when the current lap started.
                          format: date-time
                          type: string
                        images:
                          description: images is the size of the ring.
                          format: int32
                          type: integer
                        registry:
                          description: registry is the host the ring reads from.
                          type: string
                      required:
                      - images
                      - registry
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - registry
                    x-kubernetes-list-type: map
                type: object
