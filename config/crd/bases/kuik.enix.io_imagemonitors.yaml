                  properties:
                    ref:
                      description: ref is the origin reference.
                      type: string
                    runningDigests:
                      description: |-
                        runningDigests lists every digest currently running for the tag: pods pulled at
                        different times may run different ones.
                      items:
                        description: RunningDigest is one digest running for a tag,
