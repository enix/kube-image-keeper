                      format: date-time
                      type: string
                    via:
                      description: via names the ImageAlternative the entry came from,
                        as `ImageAlternative/<name>`.
                      type: string
                  required:
                  - derivedFrom
                  - reason
                  - ref
                  - since
                  - via
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              unavailableImages:
                description: |-
                  unavailableImages lists the tracked origins whose last check failed. Capped, see
                  ListCapacityPressure.
                items:
                  description: UnavailableImage is a tracked origin whose last check
                    failed.
                  properties:
                    pods:
                      description: pods counts the pods declaring it.
                      format: int32
                      type: integer
                    reason:
                      description: reason is what the check observed.
                      enum:
                      - ManifestNotFound
                      - Unauthorized
                      - QuotaExceeded
                      - Unreachable
                      type: string
                    ref:
                      description: ref is the origin reference.
                      type: string
                    since:
                      description: since is when the failure was first observed. Stamped
                        once, never refreshed.
                      format: date-time
                      type: string
                  required:
                  - pods
                  - reason
                  - ref
                  - since
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
