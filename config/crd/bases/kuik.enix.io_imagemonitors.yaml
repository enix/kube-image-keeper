                    properties:
                      available:
                        description: |-
                          available counts the references whose last check succeeded. available + unavailable is
                          short of tracked by the references the ring has not reached yet.
                        format: int32
                        type: integer
                      retained:
                        description: |-
                          retained counts the references no pod declares any more, kept for
                          unusedImageRetention.
                        format: int32
                        type: integer
                      running:
                        description: running counts the references a container carries.
                        format: int32
                        type: integer
                      standby:
                        description: |-
                          standby counts the references a pod still declares but kuik routed elsewhere, for an
                          origin, or the checked candidates never served, for an alternative.
                        format: int32
                        type: integer
                      tracked:
                        description: tracked is running + standby + retained.
                        format: int32
                        type: integer
                      unavailable:
                        description: unavailable counts the references whose last
                          check failed.
                        format: int32
                        type: integer
                    required:
                    - available
                    - retained
                    - running
                    - standby
                    - tracked
                    - unavailable
                    type: object
                  origin:
                    description: origin are the origin references declared by the
                      selected pods.
                    properties:
                      available:
                        description: |-
                          available counts the references whose last check succeeded. available + unavailable is
                          short of tracked by the references the ring has not reached yet.
                        format: int32
                        type: integer
                      drifted:
                        description: |-
                          drifted counts the tags whose running digest differs from the upstream one, under
                          driftDetection.
                        format: int32
                        type: integer
                      retained:
                        description: |-
                          retained counts the references no pod declares any more, kept for
                          unusedImageRetention.
                        format: int32
                        type: integer
                      running:
                        description: running counts the references a container carries.
                        format: int32
                        type: integer
                      standby:
                        description: |-
                          standby counts the references a pod still declares but kuik routed elsewhere, for an
                          origin, or the checked candidates never served, for an alternative.
                        format: int32
                        type: integer
                      tracked:
                        description: tracked is running + standby + retained.
                        format: int32
                        type: integer
                      unavailable:
                        description: unavailable counts the references whose last
                          check failed.
                        format: int32
                        type: integer
                    required:
                    - available
                    - drifted
                    - retained
                    - running
                    - standby
                    - tracked
                    - unavailable
                    type: object
                type: object
              retainedImages:
                description: |-
                  retainedImages lists the references kept for unusedImageRetention. Not capped: they
                  cannot be recomputed from the cluster.
                items:
                  description: RetainedImage is a reference no pod declares any more,
                    kept for unusedImageRetention.
                  properties:
                    digest:
                      description: digest is the digest that was running.
                      type: string
                    ref:
                      description: ref is the origin reference.
                      type: string
                    unusedSince:
                      description: unusedSince is when its last pod went away.
                      format: date-time
                      type: string
                  required:
                  - ref
                  - unusedSince
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              truncated:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  truncated records, per capped list that reached its cap, how many entries were left
