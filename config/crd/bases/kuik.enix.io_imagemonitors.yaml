    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageMonitor checks the availability of the images of the pods it selects, and reports the
          ones that fail or drift.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
