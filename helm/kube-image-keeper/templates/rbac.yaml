{{- if .Values.rbac.create }}
# Rules under files/ are generated from the kubebuilder markers by `task manifests`.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kube-image-keeper.clusterRoleName" . }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
rules:
  {{- .Files.Get "files/manager-rules.yaml" | nindent 2 }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kube-image-keeper.clusterRoleName" . }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
roleRef:
  kind: ClusterRole
  name: {{ include "kube-image-keeper.clusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-image-keeper.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kube-image-keeper.clusterRoleName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
rules:
  {{- .Files.Get "files/leader-election-rules.yaml" | nindent 2 }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kube-image-keeper.clusterRoleName" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
roleRef:
  kind: Role
  name: {{ include "kube-image-keeper.clusterRoleName" . }}-leader-election
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-image-keeper.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
