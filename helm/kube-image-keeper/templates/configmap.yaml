{{/*
The global config file of the three processes. A clusterID left in the values from an older
release fails the render here, before the processes refuse the file. A null or empty one, the
way to clear it from the values a release reuses, is dropped from the file.
*/}}
{{- if .Values.config.clusterID }}
{{- fail "config.clusterID is no longer a value: kuik generates the cluster ID and keeps it in ConfigMap kuik-cluster-id; to keep the value of an existing install, see docs/configuration.md#upgrading-from-a-configured-clusterid" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-image-keeper.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml (omit .Values.config "clusterID") | nindent 4 }}
