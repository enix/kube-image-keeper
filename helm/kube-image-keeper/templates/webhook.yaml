# The admission settings (failurePolicy, operations, reinvocationPolicy, sideEffects) mirror
# the marker in internal/webhook/core/v1/pod_webhook.go and docs/v3/architecture.md.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "kube-image-keeper.fullname" . }}-mutating-webhook
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "kube-image-keeper.fullname" . }}-serving-cert
webhooks:
  - name: mpod-v1.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: {{ include "kube-image-keeper.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod
    failurePolicy: Ignore
    reinvocationPolicy: IfNeeded
    sideEffects: None
    {{- with .Values.webhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-image-keeper.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.process-labels" (dict "ctx" . "process" "webhook") | nindent 4 }}
spec:
  ports:
    - name: webhook-server
      port: 443
      targetPort: webhook-server
  selector:
    {{- include "kube-image-keeper.process-selectorLabels" (dict "ctx" . "process" "webhook") | nindent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "kube-image-keeper.fullname" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "kube-image-keeper.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "kube-image-keeper.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  secretName: {{ include "kube-image-keeper.fullname" . }}-webhook-server-cert
  issuerRef:
    {{- if .Values.webhook.certificate.createIssuer }}
    kind: Issuer
    name: {{ include "kube-image-keeper.fullname" . }}-selfsigned-issuer
    {{- else }}
    {{- toYaml .Values.webhook.certificate.issuerRef | nindent 4 }}
    {{- end }}
{{- if .Values.webhook.certificate.createIssuer }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "kube-image-keeper.fullname" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- end }}
