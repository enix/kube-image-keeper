{{/* One ServiceAccount per process, so that each one holds only its own permissions. */}}
{{- $first := true }}
{{- range $process := include "kube-image-keeper.processes" . | fromYamlArray }}
{{- $sa := include "kube-image-keeper.process-serviceAccount" (dict "ctx" $ "process" $process.name "values" $process.values) | fromYaml }}
{{- if $sa.create }}
{{- if not $first }}
---
{{- end }}
{{- $first = false }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kube-image-keeper.process-labels" (dict "ctx" $ "process" $process.name) | nindent 4 }}
    {{- with $sa.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
