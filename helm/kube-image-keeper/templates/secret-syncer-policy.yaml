{{/*
Bounds the Secret writes of the secret syncer at the API server, where RBAC cannot: its
create and patch on Secrets cluster-wide grant verbs, never the shape of what it writes. The
syncer may only write a kubernetes.io/dockerconfigjson Secret labelled managed-by
kuik-secret-syncer, named kuik-inject-* in any namespace or kuik-provider-* in the release
namespace; no other identity may create or update a Secret under those prefixes, except an
update that leaves the type, the data, the labels, the immutability and the ownerReferences
unchanged, and the garbage collector dropping an ownerReference. Deletes are not matched: the
garbage collector deletes the injected Secrets through their ownerReferences. See
docs/v3/architecture.md, "Bounding what the syncer may write".

The syncer's identity is its ServiceAccount: the "default" one is refused, since every pod
of the namespace that runs under it would pass for the syncer.

The identities go into CEL string literals through toJson, which escapes any quote.
*/}}
{{- $fullname := include "kube-image-keeper.fullname" . }}
{{- $syncer := include "kube-image-keeper.process-serviceAccountName" (dict "ctx" $ "process" "secret-syncer" "values" "secretSyncer") }}
{{- if eq $syncer "default" }}
{{- fail "secretSyncer needs a dedicated ServiceAccount: set serviceAccount.create (or secretSyncer.serviceAccount.create) to true, or secretSyncer.serviceAccount.name to an existing ServiceAccount other than default" }}
{{- end }}
{{- $syncerUsername :=printf "system:serviceaccount:%s:%s" .Release.Namespace $syncer }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-secret-syncer
  labels:
    {{- include "kube-image-keeper.process-labels" (dict "ctx" $ "process" "secret-syncer") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  # failurePolicy Fail refuses the writes the policy cannot evaluate: run it only on the
  # syncer's writes and the reserved names, never on the other Secrets of the cluster.
  # matchConditions cannot read the variables below.
  matchConditions:
    - name: syncer-or-reserved-name
      expression: >-
        request.userInfo.username == {{ $syncerUsername | toJson }} ||
        (has(object.metadata.name) &&
        (object.metadata.name.startsWith('kuik-inject-') ||
        object.metadata.name.startsWith('kuik-provider-')))
  variables:
    - name: installNamespace
      expression: {{ .Release.Namespace | toJson | quote }}
    - name: isSyncer
      expression: {{ printf "request.userInfo.username == %s" ($syncerUsername | toJson) | quote }}
    - name: isGarbageCollector
      expression: >-
        request.userInfo.username in [
        'system:serviceaccount:kube-system:generic-garbage-collector',
        'system:kube-controller-manager']
    - name: name
      expression: "has(object.metadata.name) ? object.metadata.name : ''"
    - name: isInjectName
      expression: "variables.name.startsWith('kuik-inject-')"
    - name: isProviderName
      expression: "variables.name.startsWith('kuik-provider-')"
    # An update that changes neither the type, the data, the labels nor the immutability: what
    # the garbage collector does when it drops an ownerReference (deletion with
    # --cascade=orphan). A Secret made immutable could never be updated by the syncer again.
    - name: keepsContent
      expression: >-
        request.operation == 'UPDATE' &&
        has(object.type) == has(oldObject.type) &&
        (!has(object.type) || object.type == oldObject.type) &&
        has(object.data) == has(oldObject.data) &&
        (!has(object.data) || object.data == oldObject.data) &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) &&
        (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.immutable) == has(oldObject.immutable) &&
        (!has(object.immutable) || object.immutable == oldObject.immutable)
    # Nor the ownerReferences: an update such as a `kubectl replace` that rewrites every Secret
    # to rotate the encryption at rest, or a storage version migration.
    - name: keepsOwners
      expression: >-
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
        (!has(object.metadata.ownerReferences) ||
        object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
  validations:
    - expression: "!variables.isSyncer || (has(object.type) && object.type == 'kubernetes.io/dockerconfigjson')"
      reason: Forbidden
      message: the secret syncer may only write Secrets of type kubernetes.io/dockerconfigjson
    - expression: >-
        !variables.isSyncer ||
        (has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'kuik-secret-syncer')
      reason: Forbidden
      message: the secret syncer may only write Secrets labelled app.kubernetes.io/managed-by=kuik-secret-syncer
    - expression: >-
        !variables.isSyncer || variables.isInjectName ||
        (variables.isProviderName && request.namespace == variables.installNamespace)
      reason: Forbidden
      messageExpression: >-
        'the secret syncer may only write Secrets named kuik-inject-* in any namespace or kuik-provider-* in '
        + variables.installNamespace + ', not ' + request.namespace + '/' + variables.name
    - expression: >-
        variables.isSyncer || !(variables.isInjectName || variables.isProviderName) ||
        (variables.keepsContent && (variables.isGarbageCollector || variables.keepsOwners))
      reason: Forbidden
      messageExpression: >-
        'the names kuik-inject-* and kuik-provider-* are reserved to the kuik secret syncer, '
        + request.userInfo.username + ' may not write ' + request.namespace + '/' + variables.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $fullname }}-secret-syncer
  labels:
    {{- include "kube-image-keeper.process-labels" (dict "ctx" $ "process" "secret-syncer") | nindent 4 }}
spec:
  policyName: {{ $fullname }}-secret-syncer
  validationActions: [Deny]
