# Default values for kube-image-keeper.

# kuik runs as three separate processes, one Deployment each: the webhook, the reconciler
# and the secret syncer (docs/v3/architecture.md). The settings at the root apply to the
# three. Each process block further down repeats them, empty: a value set there replaces
# the root one for that process alone, except podAnnotations (merged over the root ones)
# and env (appended to the root ones). An empty value falls back to the root, so a root
# setting cannot be unset for a single process.

image:
  # -- Image repository, the same binary serves the three processes
  repository: quay.io/enix/kube-image-keeper
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag, the chart appVersion by default
  tag: ""
# -- Secrets used to pull the image
imagePullSecrets: []
# -- Logging verbosity
verbosity: INFO
# -- Number of pods of a process. Admission sits in the path of every pod creation, so a
# second webhook replica keeps it answering while one is down or rolling. The reconciler and
# the secret syncer elect a leader, so a second replica stands by and takes the lease over
# while the first is down or rolling.
replicas: 2
# -- Annotations added to the pods
podAnnotations: {}
# -- Security context of the pods
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# -- Security context of the containers
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# -- Node selector of the pods
nodeSelector: {}
# -- Tolerations of the pods
tolerations: []
# -- Affinity of the pods
affinity: {}
# -- Topology spread constraints of the pods
topologySpreadConstraints: []
# -- Deployment strategy
deploymentStrategy: {}
# -- Priority class of the pods
priorityClassName: ""
# -- Extra environment variables of the containers
env: []
# -- Readiness probe of the containers
readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
# -- Liveness probe of the containers
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
resources:
  requests:
    # -- CPU requested by a container
    cpu: "50m"
    # -- Memory requested by a container
    memory: "50Mi"
  limits:
    # -- CPU limit of a container
    cpu: "1"
    # -- Memory limit of a container
    memory: "512Mi"

# The mutating admission webhook: it routes the images of the pods being created. It writes
# nothing and every replica answers, so it never elects a leader.
webhook:
  # -- (int) Number of webhook pods
  # @default -- the root `replicas`
  replicas: ~
  certificate:
    # -- Create a self-signed Issuer for the webhook serving certificate
    createIssuer: true
    # -- Issuer the serving certificate is requested from, ignored when createIssuer is true
    issuerRef:
      kind: Issuer
      name: kube-image-keeper-selfsigned-issuer
  # -- Namespace selector of the MutatingWebhookConfiguration: which namespaces the webhook
  # rewrites pods in
  namespaceSelector: {}
  # -- Seconds a stopping webhook pod keeps answering, unready, before it stops listening. A
  # deleted pod stays a Service endpoint until every kube-proxy has seen it go, and the pods
  # created meanwhile would be admitted unrouted: raise it on a cluster where endpoint updates
  # take longer. The pod's termination grace period is this delay plus 10 seconds.
  shutdownDelaySeconds: 10
  image:
    # -- Image repository of the webhook pods
    # @default -- the root `image.repository`
    repository: ""
    # -- Image pull policy of the webhook pods
    # @default -- the root `image.pullPolicy`
    pullPolicy: ""
    # -- Image tag of the webhook pods
    # @default -- the root `image.tag`
    tag: ""
  # -- Secrets used to pull the image of the webhook pods
  # @default -- the root `imagePullSecrets`
  imagePullSecrets: []
  # -- Logging verbosity of the webhook
  # @default -- the root `verbosity`
  verbosity: ""
  # -- Annotations added to the webhook pods, merged over the root ones
  # @default -- the root `podAnnotations`
  podAnnotations: {}
  # -- Security context of the webhook pods
  # @default -- the root `podSecurityContext`
  podSecurityContext: {}
  # -- Security context of the webhook container
  # @default -- the root `securityContext`
  securityContext: {}
  # -- Node selector of the webhook pods
  # @default -- the root `nodeSelector`
  nodeSelector: {}
  # -- Tolerations of the webhook pods
  # @default -- the root `tolerations`
  tolerations: []
  # -- Affinity of the webhook pods
  # @default -- the root `affinity`
  affinity: {}
  # -- Topology spread constraints of the webhook pods
  # @default -- the root `topologySpreadConstraints`
  topologySpreadConstraints: []
  # -- Deployment strategy of the webhook
  # @default -- the root `deploymentStrategy`
  deploymentStrategy: {}
  # -- Priority class of the webhook pods
  # @default -- the root `priorityClassName`
  priorityClassName: ""
  # -- Extra environment variables of the webhook container, appended to the root ones
  # @default -- the root `env`
  env: []
  # -- Readiness probe of the webhook container
  # @default -- the root `readinessProbe`
  readinessProbe: {}
  # -- Liveness probe of the webhook container
  # @default -- the root `livenessProbe`
  livenessProbe: {}
  # -- Resources of the webhook container
  # @default -- the root `resources`
  resources: {}
  serviceAccount:
    # -- (bool) Create the ServiceAccount of the webhook
    # @default -- the root `serviceAccount.create`
    create: ~
    # -- Name of the ServiceAccount of the webhook, `<fullname>-webhook` when empty
    name: ""
    # -- Annotations added to the ServiceAccount of the webhook, merged over the root ones
    # @default -- the root `serviceAccount.annotations`
    annotations: {}
    # -- Labels added to the ServiceAccount of the webhook, merged over the root ones
    # @default -- the root `serviceAccount.extraLabels`
    extraLabels: {}

# The reconciler: every loop that talks to a registry or writes a status, for the three
# kinds. Leader-elected as soon as it has more than one replica.
reconciler:
  # -- (int) Number of reconciler pods
  # @default -- the root `replicas`
  replicas: ~
  image:
    # -- Image repository of the reconciler pods
    # @default -- the root `image.repository`
    repository: ""
    # -- Image pull policy of the reconciler pods
    # @default -- the root `image.pullPolicy`
    pullPolicy: ""
    # -- Image tag of the reconciler pods
    # @default -- the root `image.tag`
    tag: ""
  # -- Secrets used to pull the image of the reconciler pods
  # @default -- the root `imagePullSecrets`
  imagePullSecrets: []
  # -- Logging verbosity of the reconciler
  # @default -- the root `verbosity`
  verbosity: ""
  # -- Annotations added to the reconciler pods, merged over the root ones
  # @default -- the root `podAnnotations`
  podAnnotations: {}
  # -- Security context of the reconciler pods
  # @default -- the root `podSecurityContext`
  podSecurityContext: {}
  # -- Security context of the reconciler container
  # @default -- the root `securityContext`
  securityContext: {}
  # -- Node selector of the reconciler pods
  # @default -- the root `nodeSelector`
  nodeSelector: {}
  # -- Tolerations of the reconciler pods
  # @default -- the root `tolerations`
  tolerations: []
  # -- Affinity of the reconciler pods
  # @default -- the root `affinity`
  affinity: {}
  # -- Topology spread constraints of the reconciler pods
  # @default -- the root `topologySpreadConstraints`
  topologySpreadConstraints: []
  # -- Deployment strategy of the reconciler
  # @default -- the root `deploymentStrategy`
  deploymentStrategy: {}
  # -- Priority class of the reconciler pods
  # @default -- the root `priorityClassName`
  priorityClassName: ""
  # -- Extra environment variables of the reconciler container, appended to the root ones
  # @default -- the root `env`
  env: []
  # -- Readiness probe of the reconciler container
  # @default -- the root `readinessProbe`
  readinessProbe: {}
  # -- Liveness probe of the reconciler container
  # @default -- the root `livenessProbe`
  livenessProbe: {}
  # -- Resources of the reconciler container
  # @default -- the root `resources`
  resources: {}
  serviceAccount:
    # -- (bool) Create the ServiceAccount of the reconciler
    # @default -- the root `serviceAccount.create`
    create: ~
    # -- Name of the ServiceAccount of the reconciler, `<fullname>-reconciler` when empty
    name: ""
    # -- Annotations added to the ServiceAccount of the reconciler, merged over the root ones
    # @default -- the root `serviceAccount.annotations`
    annotations: {}
    # -- Labels added to the ServiceAccount of the reconciler, merged over the root ones
    # @default -- the root `serviceAccount.extraLabels`
    extraLabels: {}

# The secret syncer: it materialises and renews the pull secrets injectPullSecret asks
# for. Leader-elected as soon as it has more than one replica.
secretSyncer:
  # -- (int) Number of secret syncer pods
  # @default -- the root `replicas`
  replicas: ~
  image:
    # -- Image repository of the secret syncer pods
    # @default -- the root `image.repository`
    repository: ""
    # -- Image pull policy of the secret syncer pods
    # @default -- the root `image.pullPolicy`
    pullPolicy: ""
    # -- Image tag of the secret syncer pods
    # @default -- the root `image.tag`
    tag: ""
  # -- Secrets used to pull the image of the secret syncer pods
  # @default -- the root `imagePullSecrets`
  imagePullSecrets: []
  # -- Logging verbosity of the secret syncer
  # @default -- the root `verbosity`
  verbosity: ""
  # -- Annotations added to the secret syncer pods, merged over the root ones
  # @default -- the root `podAnnotations`
  podAnnotations: {}
  # -- Security context of the secret syncer pods
  # @default -- the root `podSecurityContext`
  podSecurityContext: {}
  # -- Security context of the secret syncer container
  # @default -- the root `securityContext`
  securityContext: {}
  # -- Node selector of the secret syncer pods
  # @default -- the root `nodeSelector`
  nodeSelector: {}
  # -- Tolerations of the secret syncer pods
  # @default -- the root `tolerations`
  tolerations: []
  # -- Affinity of the secret syncer pods
  # @default -- the root `affinity`
  affinity: {}
  # -- Topology spread constraints of the secret syncer pods
  # @default -- the root `topologySpreadConstraints`
  topologySpreadConstraints: []
  # -- Deployment strategy of the secret syncer
  # @default -- the root `deploymentStrategy`
  deploymentStrategy: {}
  # -- Priority class of the secret syncer pods
  # @default -- the root `priorityClassName`
  priorityClassName: ""
  # -- Extra environment variables of the secret syncer container, appended to the root ones
  # @default -- the root `env`
  env: []
  # -- Readiness probe of the secret syncer container
  # @default -- the root `readinessProbe`
  readinessProbe: {}
  # -- Liveness probe of the secret syncer container
  # @default -- the root `livenessProbe`
  livenessProbe: {}
  # -- Resources of the secret syncer container
  # @default -- the root `resources`
  resources: {}
  serviceAccount:
    # -- (bool) Create the ServiceAccount of the secret syncer
    # @default -- the root `serviceAccount.create`
    create: ~
    # -- Name of the ServiceAccount of the secret syncer, `<fullname>-secret-syncer` when empty.
    # Never "default": the chart fails to render when the secret syncer would run under it
    name: ""
    # -- Annotations added to the ServiceAccount of the secret syncer, merged over the root ones
    # @default -- the root `serviceAccount.annotations`
    annotations: {}
    # -- Labels added to the ServiceAccount of the secret syncer, merged over the root ones
    # @default -- the root `serviceAccount.extraLabels`
    extraLabels: {}

# One ServiceAccount per process, so each holds only its own permissions. A process block
# may set its own, like any pod setting.
serviceAccount:
  # -- Create the ServiceAccounts. When false, a process runs under the ServiceAccount its
  # block names, or "default". The secret syncer refuses "default": its Secret writes are
  # bounded by identity, so it needs a ServiceAccount of its own
  create: true
  # -- Annotations added to the ServiceAccounts
  annotations: {}
  # -- Labels added to the ServiceAccounts
  extraLabels: {}

rbac:
  # -- Create the roles of the three processes and bind them to their ServiceAccounts. When
  # false, grant them the rules of files/rbac.yaml outside this chart
  create: true

# Whether kuik may read the Secrets of application namespaces, for the imagePullSecrets of
# the pods it checks images for. Only the webhook and the reconciler get it, never the
# secret syncer.
secretAccess:
  # -- `permissive` grants get, list and watch on Secrets cluster-wide, so a private registry
  # works with nothing declared. `restricted` grants none outside the install namespace: an
  # image on a private registry kuik holds no credential for is reported Unauthorized, and
  # credentials are declared in fallbackAuth instead
  mode: permissive
  # -- `restricted` only: namespaces where the read is granted anyway, with one RoleBinding
  # each
  namespaces: []

# The global config file, mounted from a ConfigMap in the three processes and reloaded in
# place without a restart. Write any key of the file here as in the file (`metrics`,
# `mirror`, `webhook`, `registries`, `fallbackAuth`, `tls`); a key left out takes its default. A
# file that does not validate is refused whole: at startup the process exits, on a reload
# the previous config stays. See docs/configuration.md.
# -- The global config file. The chart set the default pace of every host to one check
# every `3m` and one copy every `5m`, and Docker Hub, which rations anonymous pulls, to `5m`
# and `15m`. It spaces the requests to each host of ECR Public by `1s`: it allows about 1
# anonymous request per second. Every other key takes its default. The config you set merges
# over it, key by key: set one of these keys to override it. A Docker Hub block named
# `index.docker.io`, or with another case, replaces the chart's `docker.io` block whole
# instead of merging over it; `docker.io: null` drops the chart's block. The cluster ID is not
# set here: the reconciler generates it on its first start and keeps it in the ConfigMap
# kuik-cluster-id of the release namespace
config:
  registries:
    default:
      check:
        interval: 3m
      copy:
        interval: 5m
    docker.io:
      check:
        interval: 5m
      copy:
        interval: 15m
    public.ecr.aws:
      requestInterval: 1s
    # The dual-stack (IPv6) host of ECR Public, paced on its own
    ecr-public.aws.com:
      requestInterval: 1s

# What the chart ships for Prometheus and Grafana, chart-wide: the three processes export
# their series on their own metrics Service (docs/observability.md).
monitoring:
  # The ServiceMonitor of prometheus-operator, on the three metrics Services. The job label
  # of the targets is the Service name, `<fullname>-<process>-metrics`.
  serviceMonitor:
    # -- Create a ServiceMonitor on the three metrics Services
    enabled: false
    # -- Namespace of the ServiceMonitor, the release namespace when empty. The Services it
    # selects stay in the release namespace
    namespace: ""
    # -- Scrape interval, the Prometheus default when empty
    interval: ""
    # -- Scrape timeout, the Prometheus default when empty
    scrapeTimeout: ""
    # -- Labels added to the ServiceMonitor, e.g. the one the serviceMonitorSelector of the
    # Prometheus expects
    labels: {}
    # -- Relabelings applied to the targets before scraping
    relabelings: []
    # -- Relabelings applied to the samples after scraping
    metricRelabelings: []
  # The PrometheusRule of the kuik alerts, listed under docs/observability.md#alerts.
  alerts:
    # -- Create the PrometheusRule. An explicit opt-in: the chart does not check for the CRD,
    # a cluster without prometheus-operator fails at apply time
    enabled: false
    # -- Namespace of the PrometheusRule, the release namespace when empty
    namespace: ""
    # -- Labels added to the PrometheusRule, e.g. the one the ruleSelector of the Prometheus
    # expects
    labels: {}
    # -- Annotations added to the PrometheusRule
    annotations: {}
    # -- Labels added to every alert, e.g. `team: platform`. A `severity` set here replaces the
    # one of every alert
    additionalRuleLabels: {}
    # -- Annotations added to every alert
    additionalRuleAnnotations: {}
    # -- Rule groups to render, one key per group: `false` drops the group and its alerts
    groups:
      process: true
      routing: true
      availability: true
      mirror: true
      pacing: true
      registry: true
      status: true
      secrets: true
      controller: true
    # -- Labels added to the alerts of one group, over additionalRuleLabels, e.g.
    # `mirror: { team: storage }`
    additionalRuleGroupLabels: {}
    # -- Alerts not to render, by name, e.g. `KuikManyOriginsUnavailable: true`. An unknown
    # name fails the render
    disabled: {}
    # -- Overrides of the severity (critical, warning or info) and of the for (a Prometheus
    # duration) of one alert, by name, e.g. `KuikRegistryUnreachable: { severity: critical, for: 15m }`.
    # An unknown name, another severity or a for that is not a duration fails the render
    customRules: {}
    # -- Labels that identify one scrape target, dropped by every aggregation of the rules. A
    # label a relabeling sets per target must be listed, or a pod replacement restarts the `for`
    # of the alerts; any other label a relabeling adds reaches them. Must name at least one label
    targetLabels: [instance, pod, endpoint, container, service]
    # The thresholds that can be changed. The other rules use fixed values: presence, a ratio
    # (half the requests unanswered), or a multiple of an interval of the global config kuik
    # exports (a lap over twice its shared lap).
    thresholds:
      # -- KuikManyOriginsUnavailable: unavailable origins of one resource on one host, above
      # which it is no longer image rotation
      manyOriginsUnavailable: 10
      # -- KuikMirrorOrphanTagsGrowing: orphan tags held by one mirror, above which their growth
      # alerts
      orphanTagsGrowing: 50
      # -- KuikMirrorManyOrphanDeletions: orphan tags one mirror deleted within an hour
      manyOrphanDeletions: 20
      # -- KuikMirrorSelfCheckStale: time since the last whole destination pass of a mirror, in
      # multiples of `mirror.destinationScan.interval` of the global config
      mirrorSelfCheckStaleIntervals: 3
      # -- KuikWebhookLatencyHigh: p99 of the admission latency of the webhook, in seconds
      webhookLatencyP99Seconds: 1
      # -- KuikWorkqueueBacklog: seconds an item of a reconciler workqueue may stay in progress
      workqueueBacklogSeconds: 300
  # The Grafana dashboard, files/dashboard-kuik.json, delivered as a ConfigMap for the Grafana
  # sidecar. Schema v2 (dynamic dashboards): Grafana 13 or later.
  dashboard:
    # -- Create the ConfigMap holding the Grafana dashboard (schema v2, Grafana >= 13)
    enabled: false
    # -- Namespace of the ConfigMap, the release namespace when empty
    namespace: ""
    # -- Labels of the ConfigMap, added to the common labels of the chart. Left empty, the
    # ConfigMap carries `grafana_dashboard: "1"`, what the Grafana sidecar of
    # kube-prometheus-stack watches; labels set here replace it rather than merge with it
    # @default -- `{grafana_dashboard: "1"}`
    labels: {}
    # -- Annotations of the ConfigMap, e.g. `grafana_folder: kuik` for the sidecar
    annotations: {}
    # -- Prometheus datasource the dashboard opens on, by name or uid; `default` is the default
    # datasource of the Grafana organization
    datasource: default
    # -- PromQL matchers appended to the cluster matcher of every query and variable, e.g.
    # `team=~"$team"` with a `team` entry in extraVariables. The query of the cluster
    # variable becomes `label_values(kuik_build_info{<extraMatchers>}, cluster)`
    extraMatchers: ""
    # -- Variables inserted between datasource and cluster, to narrow the clusters offered, each
    # with `name`, `query` (a label_values expression, written in full), and optionally `label`,
    # `multi`, `includeAll`, `hide`
    extraVariables: []
    # -- Add the Filters variable, Grafana's ad hoc filters: a free filter on any label, applied
    # to every query of the dashboard
    adhocFilters: false
