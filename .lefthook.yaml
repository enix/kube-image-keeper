pre-commit:
  parallel: true
  jobs:
    - name: generate manifests and code
      run: make manifests generate
      stage_fixed: true
    - name: run go fmt
      run: make fmt vet
      stage_fixed: true
    - name: lint and fix
      run: make lint-fix
      stage_fixed: true
    - name: markdownlint
      run: npx --yes --package markdownlint-cli2 --package markdownlint-rule-search-replace --package markdownlint-rule-relative-links markdownlint-cli2 --fix -- {staged_files}
      glob: "**/*.md"
      stage_fixed: true
      # markdownlint-rule-relative-links requires Node.js >= 22. Skip when Node is
      # missing or older — keeps the hook optional for contributors
      # who only touch Go code and don't have a Node toolchain.
      skip:
        - run: |
            ! command -v node ||
            [ $(node -v | cut -d'.' -f1 | tr -d 'v') -lt 22 ]

pre-push:
  parallel: true
  jobs:
    - name: run go vet
      run: make vet

commit-msg:
  jobs:
    - name: lint commit message
      run: COMMIT_MSG_FILE={1} make conform
