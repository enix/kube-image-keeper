# Test 3: the origin never resolves. Expected: image rewritten to
# quay.io/nginx/nginx-unprivileged:1.31.6-alpine, kuik.enix.io/rewrites set, Running.
apiVersion: v1
kind: Pod
metadata:
  name: fallback
  namespace: kuik-test
  labels: {kuik-test/routing: alternative}
spec:
  containers:
    - name: nginx
      image: kuik-test.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
---
# Test 4: the origin answers. Expected: image unchanged, no kuik annotation, Running.
apiVersion: v1
kind: Pod
metadata:
  name: origin-up
  namespace: kuik-test
  labels: {kuik-test/routing: alternative}
spec:
  containers:
    - name: nginx
      image: quay.io/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
---
# Test 5: same pod as test 3, in a namespace the CR does not select. Expected: image
# unchanged, no kuik annotation, ErrImagePull / ImagePullBackOff (normal here).
apiVersion: v1
kind: Pod
metadata:
  name: out-of-scope
  namespace: kuik-test-unlabeled
  labels: {kuik-test/routing: alternative}
spec:
  containers:
    - name: nginx
      image: kuik-test.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
