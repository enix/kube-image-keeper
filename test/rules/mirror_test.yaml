# Unit tests of the kuik.mirror rules, run by `task test-rules` on the rules as the chart
# renders them, so with the default thresholds: 3 scan intervals, 50 orphan tags, 20 orphan
# deletions.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  - name: KuikImageUnrecoverable fires after 15 minutes of SourceNotFound, which KuikImageCopyFailing leaves to it
    interval: 1m
    input_series:
      - series: 'kuik_image_copy_failed{kind="ImageMirror", name="harbor", image="docker.io/library/nginx:1.27", registry="docker.io", reason="SourceNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 14m
        alertname: KuikImageUnrecoverable
      - eval_time: 15m
        alertname: KuikImageUnrecoverable
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: ImageMirror
              name: harbor
              image: docker.io/library/nginx:1.27
              registry: docker.io
              reason: SourceNotFound
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: A mirrored image has no source left.
              description: >-
                docker.io/library/nginx:1.27 of ImageMirror/harbor is missing from the destination
                and from every source: pods running it depend on a node cache. Restore it upstream
                or move the workloads to another tag.
      - eval_time: 2h30m
        alertname: KuikImageCopyFailing

  - name: KuikImageUnrecoverable stays silent when the source is back within 15 minutes
    interval: 1m
    input_series:
      - series: 'kuik_image_copy_failed{kind="ImageMirror", name="harbor", image="docker.io/library/nginx:1.27", registry="docker.io", reason="SourceNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x14 stale'
    alert_rule_test:
      - eval_time: 15m
        alertname: KuikImageUnrecoverable
      - eval_time: 30m
        alertname: KuikImageUnrecoverable

  - name: KuikImageCopyFailing fires after 2 hours of any other reason, which KuikImageUnrecoverable leaves to it
    interval: 1m
    input_series:
      - series: 'kuik_image_copy_failed{kind="ImageMirror", name="harbor", image="docker.io/library/nginx:1.27", registry="harbor.example.com", reason="PushRejected", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x150'
    alert_rule_test:
      - eval_time: 1h59m
        alertname: KuikImageCopyFailing
      - eval_time: 2h
        alertname: KuikImageCopyFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMirror
              name: harbor
              image: docker.io/library/nginx:1.27
              registry: harbor.example.com
              reason: PushRejected
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: A mirror copy keeps failing.
              description: >-
                The copy of docker.io/library/nginx:1.27 by ImageMirror/harbor keeps failing on
                harbor.example.com: PushRejected. Check that registry and the credentials kuik holds
                for it.
      - eval_time: 2h
        alertname: KuikImageUnrecoverable

  - name: KuikImageCopyFailing stays silent when the copy succeeds within 2 hours
    interval: 1m
    input_series:
      - series: 'kuik_image_copy_failed{kind="ImageMirror", name="harbor", image="docker.io/library/nginx:1.27", registry="harbor.example.com", reason="PushRejected", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x119 stale'
    alert_rule_test:
      - eval_time: 2h
        alertname: KuikImageCopyFailing
      - eval_time: 2h30m
        alertname: KuikImageCopyFailing

  # One image copied again between the samples of 9m and 10m.
  - name: KuikMirrorRecopying fires 5 minutes after one recopy and clears an hour after it
    interval: 1m
    input_series:
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Recopy", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0x9 1x80'
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Initial", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 14m
        alertname: KuikMirrorRecopying
      - eval_time: 15m
        alertname: KuikMirrorRecopying
        exp_alerts: &recopying
          - exp_labels:
              severity: warning
              kind: ImageMirror
              name: harbor
              reason: Recopy
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: Copies went missing at a mirror destination.
              description: >-
                ImageMirror/harbor copied images again: something deletes at its destination outside
                kuik. Exclude the mirror's path from that retention policy or tool.
      - eval_time: 68m
        alertname: KuikMirrorRecopying
        exp_alerts: *recopying
      - eval_time: 69m
        alertname: KuikMirrorRecopying

  - name: KuikMirrorRecopying stays silent on first copies, on resyncs, and on a reconciler restart that resets the counter
    interval: 1m
    input_series:
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Initial", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x9 stale'
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Resync", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x9 stale'
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Recopy", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '4x9 stale'
      - series: 'kuik_mirror_copies_total{kind="ImageMirror", name="harbor", reason="Recopy", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-b", instance="10.0.0.2:8080"}'
        values: '_x10 0x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: KuikMirrorRecopying
      - eval_time: 20m
        alertname: KuikMirrorRecopying
      - eval_time: 1h
        alertname: KuikMirrorRecopying

  # The last pass ended at 0, the scan interval is 1 hour: the pass is 3 intervals late after
  # 3 hours.
  - name: KuikMirrorSelfCheckStale fires 15 minutes after the destination pass is 3 scan intervals late
    interval: 1m
    input_series:
      - series: 'kuik_mirror_self_checked_timestamp_seconds{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0x240'
      # Another mirror, whose passes keep up.
      - series: 'kuik_mirror_self_checked_timestamp_seconds{kind="ImageMirror", name="ghcr", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+60x240'
      - series: 'kuik_registry_interval_seconds{registry="harbor.example.com", operation="Scan", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '3600x240'
      - series: 'kuik_registry_interval_seconds{registry="ghcr.io", operation="Scan", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '3600x240'
      # The check and copy intervals of a host are not the scan interval.
      - series: 'kuik_registry_interval_seconds{registry="docker.io", operation="Check", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '60x240'
      - series: 'kuik_registry_interval_seconds{registry="docker.io", operation="Copy", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '60x240'
    alert_rule_test:
      - eval_time: 3h15m
        alertname: KuikMirrorSelfCheckStale
      - eval_time: 3h16m
        alertname: KuikMirrorSelfCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMirror
              name: harbor
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: A mirror destination is no longer verified.
              description: >-
                The destination of ImageMirror/harbor has not been verified for 3h 16m 0s, well past
                mirror.destinationScan.interval: its copy statuses are unverified. Check the
                reconciler logs for the destination registry.

  - name: KuikMirrorSelfCheckStale stays silent when a late pass ends within the 15 minutes
    interval: 1m
    input_series:
      - series: 'kuik_mirror_self_checked_timestamp_seconds{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0x194 11700x45'
      - series: 'kuik_registry_interval_seconds{registry="harbor.example.com", operation="Scan", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '3600x240'
    alert_rule_test:
      - eval_time: 3h16m
        alertname: KuikMirrorSelfCheckStale
      - eval_time: 4h
        alertname: KuikMirrorSelfCheckStale

  # The Scan series goes away once no mirror declares a destination scan: the rule file says
  # so, and leaves that case to KuikResourceNotReady.
  - name: KuikMirrorSelfCheckStale stays silent without a scan interval
    interval: 1m
    input_series:
      - series: 'kuik_mirror_self_checked_timestamp_seconds{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0x300'
      - series: 'kuik_registry_interval_seconds{registry="docker.io", operation="Check", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '60x300'
    alert_rule_test:
      - eval_time: 5h
        alertname: KuikMirrorSelfCheckStale

  # One more orphan tag every minute: above 50 from 51m.
  - name: KuikMirrorOrphanTagsGrowing fires once more than 50 orphan tags have kept growing for 1 hour
    interval: 1m
    input_series:
      - series: 'kuik_mirror_tags_orphan{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x200'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: KuikMirrorOrphanTagsGrowing
      - eval_time: 1h51m
        alertname: KuikMirrorOrphanTagsGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMirror
              name: harbor
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: Orphan tags keep growing at a mirror destination.
              description: >-
                ImageMirror/harbor holds 111 orphan tags and counting: something writes to its
                repositories outside kuik, or clusterName changed. Find the writer.

  - name: KuikMirrorOrphanTagsGrowing stays silent on many orphan tags that do not grow, and on 50 that do
    interval: 1m
    input_series:
      - series: 'kuik_mirror_tags_orphan{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '300x480'
      - series: 'kuik_mirror_tags_orphan{kind="ImageMirror", name="ghcr", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x50 50x430'
    alert_rule_test:
      - eval_time: 2h
        alertname: KuikMirrorOrphanTagsGrowing
      - eval_time: 8h
        alertname: KuikMirrorOrphanTagsGrowing

  # The count stops at 60 tags at 1h: the last growth leaves the 6 hour window at 6h59m.
  - name: KuikMirrorOrphanTagsGrowing clears 6 hours after the orphan tags stopped growing
    interval: 1m
    input_series:
      - series: 'kuik_mirror_tags_orphan{kind="ImageMirror", name="harbor", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+1x60 60x420'
    alert_rule_test:
      - eval_time: 6h58m
        alertname: KuikMirrorOrphanTagsGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMirror
              name: harbor
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: Orphan tags keep growing at a mirror destination.
              description: >-
                ImageMirror/harbor holds 60 orphan tags and counting: something writes to its
                repositories outside kuik, or clusterName changed. Find the writer.
      - eval_time: 6h59m
        alertname: KuikMirrorOrphanTagsGrowing

  # 21 orphan tags deleted between the samples of 9m and 10m.
  - name: KuikMirrorManyOrphanDeletions fires 5 minutes after more than 20 orphan tags were deleted within the hour
    interval: 1m
    input_series:
      - series: 'kuik_mirror_tags_deleted_total{kind="ImageMirror", name="harbor", reason="Orphan", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0x9 21x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: KuikMirrorManyOrphanDeletions
      - eval_time: 15m
        alertname: KuikMirrorManyOrphanDeletions
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: ImageMirror
              name: harbor
              reason: Orphan
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: A mirror deletes orphan tags in bulk.
              description: >-
                ImageMirror/harbor deleted 21 orphan tags in an hour, usually after a clusterName
                change. Check the mirror's events before more go.

  # 19 orphan tags deleted between the samples of 1h9m and 1h10m, by a mirror that had deleted
  # 100 before. 19 and not 20: on a counter that was not 0, increase() extrapolates the hour
  # from its 59 minutes of samples and reads 20 deletions as 20.3, which fires.
  - name: KuikMirrorManyOrphanDeletions stays silent on 19 orphan tags deleted, and on unused tags deleted
    interval: 1m
    input_series:
      - series: 'kuik_mirror_tags_deleted_total{kind="ImageMirror", name="harbor", reason="Orphan", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '100x69 119x120'
      - series: 'kuik_mirror_tags_deleted_total{kind="ImageMirror", name="harbor", reason="Unused", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '0+10x190'
    alert_rule_test:
      - eval_time: 1h15m
        alertname: KuikMirrorManyOrphanDeletions
      - eval_time: 2h
        alertname: KuikMirrorManyOrphanDeletions
      - eval_time: 2h30m
        alertname: KuikMirrorManyOrphanDeletions
