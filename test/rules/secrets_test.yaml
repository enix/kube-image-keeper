# Unit tests of the kuik.secrets rules, run by `task test-rules` on the rules as the chart
# renders them. The secret syncer exports the three results of kuik_secret_applies_total at 0
# from its start.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # One failed apply a minute from 10m.
  - name: KuikSecretApplyFailing fires after 15 minutes of failed applies
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Failed", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x9 1+1x50'
      - series: 'kuik_secret_applies_total{result="Noop", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0+3x60'
    alert_rule_test:
      - eval_time: 24m
        alertname: KuikSecretApplyFailing
      - eval_time: 25m
        alertname: KuikSecretApplyFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              result: Failed
              job: kuik-secret-syncer-metrics
              namespace: kuik-system
            exp_annotations:
              summary: The secret syncer fails to write pull Secrets.
              description: >-
                Pods of the affected namespaces will fail to pull. The PullSecretInjectionFailed
                event on the resource gives the namespace and the reason. Check the RBAC of the
                secret syncer and the admission policies of those namespaces.

  # One apply failed between the samples of 9m and 10m, and its retry went through.
  - name: KuikSecretApplyFailing stays silent on one failed apply
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Failed", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x9 1x50'
      - series: 'kuik_secret_applies_total{result="Applied", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x9 1x50'
    alert_rule_test:
      - eval_time: 24m
        alertname: KuikSecretApplyFailing
      - eval_time: 25m
        alertname: KuikSecretApplyFailing
      - eval_time: 40m
        alertname: KuikSecretApplyFailing

  # KNOWN DEFECT, pinned here until the rule is fixed: the alert should keep firing.
  #
  # The apply of one pull Secret fails for good from 10m, in a namespace where nothing else
  # requeues it. The syncer returns the error, so controller-runtime retries with its default
  # backoff: 5 ms doubled after each failure, up to 1000 s. The counter below is that schedule
  # as a scrape every minute reads it: 18 failures in the first 11 minutes, 1 more 11 minutes
  # later, then 1 every 16m40s. That is longer than the 15 minutes of the rate window, which
  # is also the `for` of the alert: between 2 failures the rate reads 0 for 2 or 3 evaluations
  # and the alert starts over. It fires at 26m, on the failures of the first minutes, clears
  # at 46m and never fires again, while the Secret is still not written.
  - name: 'KNOWN DEFECT: KuikSecretApplyFailing clears after 20 minutes while one pull Secret keeps failing at the retry backoff'
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Failed", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x10 14 15 16x2 17x4 18x10 19x16 20x16 21x15 22x16 23x16 24x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KuikSecretApplyFailing
      - eval_time: 26m
        alertname: KuikSecretApplyFailing
        exp_alerts: &failing
          - exp_labels:
              severity: critical
              result: Failed
              job: kuik-secret-syncer-metrics
              namespace: kuik-system
            exp_annotations:
              summary: The secret syncer fails to write pull Secrets.
              description: >-
                Pods of the affected namespaces will fail to pull. The PullSecretInjectionFailed
                event on the resource gives the namespace and the reason. Check the RBAC of the
                secret syncer and the admission policies of those namespaces.
      - eval_time: 45m
        alertname: KuikSecretApplyFailing
        exp_alerts: *failing
      # From here on the alert should fire, and does not.
      - eval_time: 46m
        alertname: KuikSecretApplyFailing
      - eval_time: 1h30m
        alertname: KuikSecretApplyFailing
      - eval_time: 2h
        alertname: KuikSecretApplyFailing

  # From 10m, 6 applies in 10 change the Secret they write.
  - name: KuikSecretApplyFlapping fires once more than half the applies have changed something for 2 hours
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Applied", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x9 6+6x200'
      - series: 'kuik_secret_applies_total{result="Noop", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x9 4+4x200'
      - series: 'kuik_secret_applies_total{result="Failed", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0x210'
    alert_rule_test:
      - eval_time: 2h9m
        alertname: KuikSecretApplyFlapping
      - eval_time: 2h10m
        alertname: KuikSecretApplyFlapping
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kuik-secret-syncer-metrics
              namespace: kuik-system
            exp_annotations:
              summary: Something undoes the pull Secrets kuik writes.
              description: >-
                60% of the pull Secret applies change something: another controller or a policy
                undoes what kuik writes. Find it and keep it off the injected pull Secrets.

  # 5 applies in 10 change something, the failed ones counting among the 10.
  - name: KuikSecretApplyFlapping stays silent on half the applies changing something
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Applied", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0+5x300'
      - series: 'kuik_secret_applies_total{result="Noop", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0+3x300'
      - series: 'kuik_secret_applies_total{result="Failed", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0+2x300'
    alert_rule_test:
      - eval_time: 2h10m
        alertname: KuikSecretApplyFlapping
      - eval_time: 4h
        alertname: KuikSecretApplyFlapping

  # The first apply of each Secret after a start counts as Applied: 200 of them between the
  # samples of 0 and 1m, then 1 apply a minute that changes nothing. Most applies of the
  # first hour are Applied, which the 2 hours of the alert outlast.
  - name: KuikSecretApplyFlapping stays silent after a start of the syncer, and with no apply at all
    interval: 1m
    input_series:
      - series: 'kuik_secret_applies_total{result="Applied", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0 200x300'
      - series: 'kuik_secret_applies_total{result="Noop", job="kuik-secret-syncer-metrics", namespace="kuik-system", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.2.1:8080"}'
        values: '0+1x300'
      # Another install, in another namespace, whose syncer applies nothing: 0 over 0 applies
      # is no ratio.
      - series: 'kuik_secret_applies_total{result="Applied", job="kuik-secret-syncer-metrics", namespace="kuik-staging", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.3.1:8080"}'
        values: '0x300'
      - series: 'kuik_secret_applies_total{result="Noop", job="kuik-secret-syncer-metrics", namespace="kuik-staging", service="kuik-secret-syncer-metrics", endpoint="metrics", container="secret-syncer", pod="kuik-secret-syncer-a", instance="10.0.3.1:8080"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 30m
        alertname: KuikSecretApplyFlapping
      - eval_time: 2h1m
        alertname: KuikSecretApplyFlapping
      - eval_time: 4h
        alertname: KuikSecretApplyFlapping
