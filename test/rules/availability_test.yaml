# Unit tests of the kuik.availability rules, run by `task test-rules` on the rules as the chart
# renders them, so with the default threshold: more than 10 unavailable origins.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  - name: KuikManyOriginsUnavailable fires on 11 origins of one resource on one registry, whatever their reasons
    interval: 1m
    input_series:
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app01:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app02:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app03:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app04:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app05:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app06:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app07:1", registry="docker.io", reason="Unreachable", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app08:1", registry="docker.io", reason="Unreachable", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app09:1", registry="docker.io", reason="Unreachable", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app10:1", registry="docker.io", reason="QuotaExceeded", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app11:1", registry="docker.io", reason="Unauthorized", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 29m
        alertname: KuikManyOriginsUnavailable
      - eval_time: 30m
        alertname: KuikManyOriginsUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMonitor
              name: all
              registry: docker.io
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: Many origin images are unavailable on one registry.
              description: >-
                11 origins of ImageMonitor/all fail on docker.io: suspect the host, its quota or the
                credentials. status.unavailableImages gives the reason of each one.

