        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app08:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app09:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app10:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KuikManyOriginsUnavailable
      - eval_time: 1h
        alertname: KuikManyOriginsUnavailable

  # 12 origins in all, 6 at most for one resource on one registry.
  - name: KuikManyOriginsUnavailable counts per resource and per registry
    interval: 1m
    input_series:
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app01:1", registry="docker.io", reason="Unreachable", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
