  - name: KuikAlternativeUnauthorized fires after 15 minutes
    interval: 1m
    input_series:
      - series: 'kuik_image_alternative_unavailable{kind="ImageMonitor", name="all", image="harbor.example.com/proxy/library/nginx:1.27", registry="harbor.example.com", derived_from="docker.io/library/nginx:1.27", via="ImageAlternative/harbor-proxy", reason="Unauthorized", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: KuikAlternativeUnauthorized
      - eval_time: 15m
        alertname: KuikAlternativeUnauthorized
        exp_alerts:
          - exp_labels:
              severity: warning
              kind: ImageMonitor
              name: all
              image: harbor.example.com/proxy/library/nginx:1.27
              registry: harbor.example.com
              derived_from: docker.io/library/nginx:1.27
              via: ImageAlternative/harbor-proxy
              reason: Unauthorized
              job: kuik-reconciler-metrics
              namespace: kuik-system
            exp_annotations:
              summary: An alternative is refused as Unauthorized.
              description: >-
                ImageAlternative/harbor-proxy cannot offer
                harbor.example.com/proxy/library/nginx:1.27 without a credential. Add one to the
                auth of ImageAlternative/harbor-proxy or to fallbackAuth.

  - name: KuikAlternativeUnauthorized stays silent on another reason, or when a credential is added within 15 minutes
    interval: 1m
    input_series:
      - series: 'kuik_image_alternative_unavailable{kind="ImageMonitor", name="all", image="harbor.example.com/proxy/library/nginx:1.27", registry="harbor.example.com", derived_from="docker.io/library/nginx:1.27", via="ImageAlternative/harbor-proxy", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x30'
      - series: 'kuik_image_alternative_unavailable{kind="ImageMonitor", name="all", image="harbor.example.com/proxy/library/redis:7", registry="harbor.example.com", derived_from="docker.io/library/redis:7", via="ImageAlternative/harbor-proxy", reason="Unauthorized", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
        values: '1x14 stale'
    alert_rule_test:
      - eval_time: 15m
        alertname: KuikAlternativeUnauthorized
      - eval_time: 30m
        alertname: KuikAlternativeUnauthorized
