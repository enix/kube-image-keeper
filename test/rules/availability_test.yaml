      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app05:1", registry="docker.io", reason="ManifestNotFound", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
