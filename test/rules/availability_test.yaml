  # 6 origins, each exported by the old and the new reconciler pod: 12 series.
  - name: KuikManyOriginsUnavailable counts an origin once while two reconciler pods export it
    interval: 1m
    input_series:
      - series: 'kuik_image_origin_unavailable{kind="ImageMonitor", name="all", image="docker.io/library/app01:1", registry="docker.io", reason="Unreachable", job="kuik-reconciler-metrics", namespace="kuik-system", service="kuik-reconciler-metrics", endpoint="metrics", container="reconciler", pod="kuik-reconciler-a", instance="10.0.0.1:8080"}'
