{{- if .Values.ingress.registry.enabled -}}
{{- $fullname := include "kuik-tester.fullname" . -}}
{{- $host := printf "*.%s" .Values.baseDomain -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-registry
  labels:
    {{- include "kuik-tester.labels" . | nindent 4 }}
  {{- with .Values.ingress.registry.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.registry.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.registry.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-registry
                port:
                  number: 8080
{{- end }}
