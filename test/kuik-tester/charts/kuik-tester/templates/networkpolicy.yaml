{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kuik-tester.fullname" . }}
  labels:
    {{- include "kuik-tester.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kuik-tester.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        {{- if .Values.plainHTTP.enabled }}
        - protocol: TCP
          port: 5000
        {{- end }}
    {{- with .Values.networkPolicy.adminFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8081
    {{- end }}
{{- end }}
