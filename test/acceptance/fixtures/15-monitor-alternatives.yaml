# since: 3.0.0-alpha.5
# Test 15: an ImageMonitor on the pods of test 3 and 4 that also monitors the alternatives
# kuik-test-nginx offers for their origins, and finds the kuik-test.invalid one unavailable.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMonitor
metadata:
  name: kuik-test-alternatives
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: alternative
  monitorAlternatives: true
