# since: 3.0.0-alpha.4
# Test 13: an ImageMonitor on a pod that declares the private repository without any pull
# Secret, so the monitor checks it anonymously and the registry refuses. The pod never pulls:
# ErrImagePull is expected, even on a node that holds the image of test 11.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMonitor
metadata:
  name: kuik-test-anonymous
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/monitor: anonymous
---
apiVersion: v1
kind: Pod
metadata:
  name: anonymous
  namespace: kuik-test
  labels:
    kuik-test/monitor: anonymous
spec:
  containers:
    - name: nginx
      image: ${PRIVATE_REPO}:1.31.6-alpine
      # The pod of test 11 pulls the same image: Always keeps a node cache from starting this one.
      imagePullPolicy: Always
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
