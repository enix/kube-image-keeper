# since: 3.0.0-alpha.4
# Test 14: an ImageMirror that copies for real under --mirror-prefix, a path the user dedicates
# to the test, with the push Secret kuik-test-mirror-push the user created in the kuik
# namespace. rewritePolicy None: it copies and never routes, so its pod stays on its origin.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMirror
metadata:
  name: kuik-test-mirror-copy
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: mirror-copy
  rewritePolicy: None
  destination:
    path: ${MIRROR_PREFIX}
    manage:
      auth:
        secretRef:
          name: kuik-test-mirror-push
---
apiVersion: v1
kind: Pod
metadata:
  name: mirror-copy
  namespace: kuik-test
  labels:
    kuik-test/routing: mirror-copy
spec:
  containers:
    - name: nginx
      image: quay.io/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
