# since: 3.0.0-beta.1
# Test 21: an OnFailure ImageAlternative whose second candidate declares credentials, and a pod
# outside its namespaceSelector carrying a kuik.enix.io/rewrites record naming it that kuik never
# wrote. A record is not proof that kuik rewrote the pod: no pull Secret may land there. The
# record's rewrittenTo is the pod's image, so the webhook keeps it as written; the image is on a
# .invalid host, so nothing is pulled. The source is a placeholder, not a credential.
apiVersion: v1
kind: Secret
metadata:
  name: kuik-test-scope-creds
  namespace: ${KUIK_NAMESPACE}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"kuik-test-scope-auth.invalid":{"username":"kuik-test","password":"placeholder"}}}'
---
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: kuik-test-scoped-secret
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: scoped-secret
  rewritePolicy: OnFailure
  alternatives:
    - repository: kuik-test-scope.invalid/nginx/nginx-unprivileged
    - repository: kuik-test-scope-auth.invalid/nginx/nginx-unprivileged
      auth:
        secretRef:
          name: kuik-test-scope-creds
---
# The label the ImageAlternative selects, in the namespace it does not select.
apiVersion: v1
kind: Pod
metadata:
  name: foreign-record
  namespace: kuik-test-unlabeled
  labels:
    kuik-test/routing: scoped-secret
  annotations:
    kuik.enix.io/rewrites: '{"nginx":{"by":"ImageAlternative/kuik-test-scoped-secret","origin":"kuik-test-scope.invalid/nginx/nginx-unprivileged:1.31.6-alpine","rewrittenTo":"kuik-test-scope-auth.invalid/nginx/nginx-unprivileged:1.31.6-alpine","policy":"OnFailure"}}'
spec:
  containers:
    - name: nginx
      image: kuik-test-scope-auth.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
