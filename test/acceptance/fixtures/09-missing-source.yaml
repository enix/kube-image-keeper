# since: 3.0.0-alpha.3
# Test 9: an ImageAlternative whose source Secret kuik-test-absent-creds never exists.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: kuik-test-missing-secret
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: missing-secret
  rewritePolicy: Always
  alternatives:
    - repository: kuik-test-missing.invalid/nginx/nginx-unprivileged
    - repository: quay.io/nginx/nginx-unprivileged
      auth:
        secretRef:
          name: kuik-test-absent-creds
