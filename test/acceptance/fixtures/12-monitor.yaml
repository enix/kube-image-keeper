# since: 3.0.0-alpha.4
# Test 12: an ImageMonitor on the pods of test 3 and 4. It tracks the origin the pod fallback
# declares (kuik-test.invalid, standby since kuik rerouted it) and the one origin-up runs
# (${PUBLIC_REPO}), and finds the first unavailable.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMonitor
metadata:
  name: kuik-test-monitor
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: alternative
