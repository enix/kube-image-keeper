# since: 3.0.0-alpha.2
# Tests 3, 4, 5 and 7: an OnFailure ImageAlternative whose first candidate never resolves
# (.invalid is reserved, RFC 2606) and whose second is the real image; a pod it must
# reroute, a pod whose origin answers, a pod with the right label in a namespace it does
# not select.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: kuik-test-nginx
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: alternative
  rewritePolicy: OnFailure
  alternatives:
    - repository: kuik-test.invalid/nginx/nginx-unprivileged
    - repository: quay.io/nginx/nginx-unprivileged
---
# Test 3: the origin never resolves.
apiVersion: v1
kind: Pod
metadata:
  name: fallback
  namespace: kuik-test
  labels:
    kuik-test/routing: alternative
spec:
  containers:
    - name: nginx
      image: kuik-test.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
---
# Test 4: the origin answers.
apiVersion: v1
kind: Pod
metadata:
  name: origin-up
  namespace: kuik-test
  labels:
    kuik-test/routing: alternative
spec:
  containers:
    - name: nginx
      image: quay.io/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
---
# Test 5: same label, namespace not selected; its pull fails, kuik must not step in.
apiVersion: v1
kind: Pod
metadata:
  name: out-of-scope
  namespace: kuik-test-unlabeled
  labels:
    kuik-test/routing: alternative
spec:
  containers:
    - name: nginx
      image: kuik-test.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
