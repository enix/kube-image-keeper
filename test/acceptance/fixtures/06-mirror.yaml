# since: 3.0.0-alpha.2
# Test 6: an Always ImageMirror whose destination never answers, so nothing is ever served
# from it, and a pod it selects.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMirror
metadata:
  name: kuik-test-mirror
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: mirror
  rewritePolicy: Always
  destination:
    path: registry.invalid/kuik-test
  # Since 3.0.0-alpha.4 the mirror records its repository before the push fails: with cleanup
  # on, its finalizer would list the tags of a host that never answers and hold the CR forever.
  cleanup:
    enabled: false
---
apiVersion: v1
kind: Pod
metadata:
  name: mirror
  namespace: kuik-test
  labels:
    kuik-test/routing: mirror
spec:
  containers:
    - name: nginx
      image: quay.io/nginx/nginx-unprivileged:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
