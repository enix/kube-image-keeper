# since: 3.0.0-beta.1
# Test 22: an ImageMirror copying for real under --mirror-prefix, with the push Secret
# kuik-test-mirror-push of test 14, and an Always ImageAlternative covering the same image for
# the same pod, whose alternative answers too. The copy must read the origin first. rewritePolicy
# None: the mirror never routes, the alternative does. Cleanup off: the finalizer never waits on
# the destination, and the tag stays under the prefix.
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMirror
metadata:
  name: kuik-test-origin-first
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: origin-first
  rewritePolicy: None
  destination:
    path: ${MIRROR_PREFIX}/origin-first
    manage:
      auth:
        secretRef:
          name: kuik-test-mirror-push
  cleanup:
    enabled: false
---
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: kuik-test-quay-alternative
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: origin-first
  rewritePolicy: Always
  alternatives:
    - repository: quay.io/nginx/nginx-unprivileged
    - repository: ${PUBLIC_REPO}
---
apiVersion: v1
kind: Pod
metadata:
  name: origin-first
  namespace: kuik-test
  labels:
    kuik-test/routing: origin-first
spec:
  containers:
    - name: nginx
      image: ${PUBLIC_REPO}:1.31.6-alpine
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
