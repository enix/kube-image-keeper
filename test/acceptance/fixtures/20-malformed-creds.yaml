# since: 3.0.0-alpha.6
# Test 20: an ImageAlternative whose source Secret is a docker config Secret whose auth field is
# not base64. The keyring rejects it, so kuik reports it malformed instead of going anonymous.
# The Secret is a placeholder, not a credential.
apiVersion: v1
kind: Secret
metadata:
  name: kuik-test-malformed-creds
  namespace: ${KUIK_NAMESPACE}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"quay.io":{"auth":"not base64!"}}}'
---
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: kuik-test-malformed-creds
spec:
  namespaceSelector:
    matchLabels:
      kuik.enix.io/test: "true"
      kubernetes.io/metadata.name: kuik-test
  podSelector:
    matchLabels:
      kuik-test/routing: malformed-creds
  rewritePolicy: Always
  alternatives:
    - repository: quay.io/nginx/nginx-unprivileged
      auth:
        secretRef:
          name: kuik-test-malformed-creds
