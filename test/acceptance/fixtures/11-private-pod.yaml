# since: 3.0.0-alpha.3
# Test 11, second half: a pod kuik reroutes to the private repository. It pulls Always: a
# cached image would skip the pull this test is about.
apiVersion: v1
kind: Pod
metadata:
  name: private
  namespace: kuik-test
  labels:
    kuik-test/routing: private
spec:
  containers:
    - name: nginx
      image: kuik-test-private.invalid/nginx/nginx-unprivileged:1.31.6-alpine
      imagePullPolicy: Always
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
