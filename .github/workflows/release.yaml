name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

# Writes go through their own secrets (RELEASE_GITHUB_TOKEN for the release,
# GH_TOKEN_PUBLISH_HELM_CHART for the chart in build.yaml): the workflow token only reads this
# repository, in these jobs and in the workflows they call.
permissions:
  contents: read

env:
  COMMIT_NAME: Monkeynator
  COMMIT_EMAIL: monkeynator@enix.io

jobs:
  semver:
    name: Semantic Version (dry-run)
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.dry-run.outputs.new_release_published }}
      last: ${{ steps.dry-run.outputs.last_release_version }}
      version: ${{ steps.dry-run.outputs.new_release_version }}
      channel: ${{ steps.dry-run.outputs.new_release_channel }}
      # Any channel is a pre-release; a stable release carries none
      prerelease: ${{ steps.dry-run.outputs.new_release_channel != '' }}
      # Whether the release publishes written notes from its draft release
      written_notes: ${{ steps.draft.outcome == 'success' }}
      # The chart's artifacthub.io/changes, rendered from the release-notes.yaml asset of the draft
      changes: ${{ steps.draft.outputs.changes }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run semantic-release (dry-run)
        id: dry-run
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9.0.0
            semantic-release-slack-bot@^4.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Inspect semantic-release (dry-run) outcome
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}/.github
          SR_PUBLISHED: ${{ steps.dry-run.outputs.new_release_published }}
          SR_LAST: ${{ steps.dry-run.outputs.last_release_version }}
          SR_VERSION: ${{ steps.dry-run.outputs.new_release_version }}
          SR_CHANNEL: ${{ steps.dry-run.outputs.new_release_channel }}
        run: |
          import os
          import sys
          from lib import *

          if os.environ["SR_PUBLISHED"] == "true":
            print("A new release should be published!")
            print("Previous version: {}, next version: {}".format(os.environ["SR_LAST"], os.environ["SR_VERSION"]))
          else:
            print("Nothing should be published, skipping...")
            sys.exit(1)

      # Maintenance-line branches (X.Y.x-stable, X.Y.x-rc) are regular release
      # branches for semantic-release, so nothing caps their computed version
      # natively; a stray feat or breaking-change commit on the line would
      # otherwise escape it (e.g. publish a 2.4.0 from the 2.3 line).
      - name: Enforce the maintenance line version range
        if: contains(github.ref_name, '.x-')
        env:
          NEXT_VERSION: ${{ steps.dry-run.outputs.new_release_version }}
        run: |
          line="${GITHUB_REF_NAME%.x-*}"
          if [[ "${NEXT_VERSION}" != "${line}."* ]]; then
            echo "::error::Version ${NEXT_VERSION} escapes the ${line}.x maintenance line; check for feat or breaking-change commits on the branch."
            exit 1
          fi

      # Every release publishes the notes its releaser wrote with the release-notes skill,
      # kept in a draft release for the tag of the version computed above (CONTRIBUTING.md,
      # "Release notes"). The notes are the draft's release-notes.yaml asset, their single
      # source: the release body and the chart's artifacthub.io/changes are rendered from it,
      # and the draft's body is only the skill's preview of that rendering. The changelog
      # semantic-release generates from the commits is attached to every release as its
      # CHANGELOG.md asset (.releaserc.mjs).
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Require the draft release of the written notes
        id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.dry-run.outputs.new_release_version }}
        run: |
          id=$(.github/release-draft.sh find "v${NEXT_VERSION}")
          .github/release-draft.sh source "${id}" "${RUNNER_TEMP}/release-notes.yaml"
          go run ./hack/releasenotes -version "${NEXT_VERSION}" changes "${RUNNER_TEMP}/release-notes.yaml" > "${RUNNER_TEMP}/changes.yaml"
          delimiter="changes-$(openssl rand -hex 8)"
          {
            echo "changes<<${delimiter}"
            cat "${RUNNER_TEMP}/changes.yaml"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml

  test:
    name: Test
    uses: ./.github/workflows/test.yaml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yaml

  build:
    name: Build
    uses: ./.github/workflows/build.yaml
    needs:
      - lint
      - test
      - e2e
      - semver
    with:
      REPO_IMAGE: ${{ vars.REPO_IMAGE }}
      REPO_CHART: ${{ vars.REPO_CHART }}
      VERSION: ${{ needs.semver.outputs.version }}
      # A job output is a string, and build.yaml declares these inputs as booleans: compare
      # rather than forward, or the call is rejected and the job never starts.
      PRERELEASE: ${{ needs.semver.outputs.prerelease == 'true' }}
      # Only a stable release of the main line owns the :latest image tag. A maintenance line
      # also publishes stable versions, and they must not move :latest back to an older major.
      IS_LATEST: ${{ needs.semver.outputs.channel == '' && github.ref_name == 'release' }}
      CHANGES: ${{ needs.semver.outputs.changes }}
    secrets:
      REPO_LOGIN: ${{ secrets.QUAY_USERNAME }}
      REPO_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
      GH_TOKEN_PUBLISH_HELM_CHART: ${{ secrets.GH_TOKEN_PUBLISH_HELM_CHART }}

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs:
      - semver
      - build
    outputs:
      last: ${{ steps.release.outputs.last_release_version }}
      published: ${{ steps.release.outputs.new_release_published }}
      channel: ${{ steps.release.outputs.new_release_channel }}
      version: ${{ steps.release.outputs.new_release_version }}
      major: ${{ steps.release.outputs.new_release_major_version }}
      minor: ${{ steps.release.outputs.new_release_minor_version }}
      patch: ${{ steps.release.outputs.new_release_patch_version }}
      notes: ${{ steps.release.outputs.new_release_notes }}
      prerelease: ${{ needs.semver.outputs.prerelease }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # @semantic-release/github always creates a new release (publish.js of v12, the one
      # semantic-release 25 depends on), so the notes leave their draft for semantic-release's
      # generateNotes step (.releaserc.mjs). The draft goes first, while no release holds its
      # tag, and comes back below when no release follows. Found by tag again, not by the id
      # the semver job saw, so "Re-run failed jobs" takes a draft written again since. The
      # published notes are the rendering of its release-notes.yaml asset, not its body,
      # which nobody edits by hand; the asset is kept for the restore below, and published
      # as an asset of the release (RELEASE_NOTES_SOURCE).
      - name: Setup Go
        if: ${{ needs.semver.outputs.written_notes == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Take the written notes out of their draft release
        if: ${{ needs.semver.outputs.written_notes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          VERSION: ${{ needs.semver.outputs.version }}
        run: |
          id=$(.github/release-draft.sh find "v${VERSION}")
          .github/release-draft.sh source "${id}" "${RUNNER_TEMP}/release-notes.yaml"
          go run ./hack/releasenotes -version "${VERSION}" render "${RUNNER_TEMP}/release-notes.yaml" > "${RUNNER_TEMP}/rendered.md"
          cat "${RUNNER_TEMP}/rendered.md"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          # The notes file last: the restore step below keys on it, so it exists only once the
          # draft is gone, and a failed delete never leads to a second draft.
          mv "${RUNNER_TEMP}/rendered.md" "${RUNNER_TEMP}/release-notes.md"

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9.0.0
            semantic-release-slack-bot@^4.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RELEASE_NOTES_FILE: ${{ needs.semver.outputs.written_notes == 'true' && format('{0}/release-notes.md', runner.temp) || '' }}
          RELEASE_NOTES_SOURCE: ${{ needs.semver.outputs.written_notes == 'true' && format('{0}/release-notes.yaml', runner.temp) || '' }}
          GIT_COMMITTER_NAME: ${{ env.COMMIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ env.COMMIT_EMAIL }}
          GIT_AUTHOR_NAME: ${{ env.COMMIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ env.COMMIT_EMAIL }}

      # semantic-release published nothing (main moved during the build, a failure before or
      # after the tag): put the draft back, so the notes are not left in a log. If the tag was
      # pushed, publish that draft by hand; otherwise dispatch again (CONTRIBUTING.md).
      - name: Restore the draft release when no release was published
        if: ${{ always() && needs.semver.outputs.written_notes == 'true' && steps.release.outputs.new_release_published != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          VERSION: ${{ needs.semver.outputs.version }}
          PRERELEASE: ${{ needs.semver.outputs.prerelease }}
        run: |
          notes="${RUNNER_TEMP}/release-notes.md"
          if [[ ! -s "${notes}" ]]; then
            echo "The notes were never taken out of their draft: nothing to restore."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" --jq .html_url; then
            echo "A release already exists for v${VERSION}: nothing to restore."
            exit 0
          fi
          # Marked as semantic-release would mark it, so publishing it by hand needs no flag.
          # Its source goes back as its asset, named after the file.
          gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft --prerelease="${PRERELEASE}" --title "v${VERSION}" --notes-file "${notes}" "${RUNNER_TEMP}/release-notes.yaml"

      - name: Inspect semantic-release outcome
        id: inspect
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}/.github
          PRERELEASE: ${{ needs.semver.outputs.prerelease }}
          SRDRY_CHANNEL: ${{ needs.semver.outputs.channel }}
          SRDRY_VERSION: ${{ needs.semver.outputs.version }}
          SR_LAST: ${{ steps.release.outputs.last_release_version }}
          SR_PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          SR_CHANNEL: ${{ steps.release.outputs.new_release_channel }}
          SR_VERSION: ${{ steps.release.outputs.new_release_version }}
          SR_MAJOR: ${{ steps.release.outputs.new_release_major_version }}
          SR_MINOR: ${{ steps.release.outputs.new_release_minor_version }}
          SR_PATCH: ${{ steps.release.outputs.new_release_patch_version }}
          SR_NOTES: ${{ steps.release.outputs.new_release_notes }}
        run: |
          from lib import *
          import os

          header('semantic-release job outputs')
          info('last        = {}'.format(os.environ['SR_LAST']))
          info('published   = {}'.format(os.environ['SR_PUBLISHED']))
          info('channel     = {}'.format(os.environ['SR_CHANNEL']))
          info('version     = {}'.format(os.environ['SR_VERSION']))
          info('major       = {}'.format(os.environ['SR_MAJOR']))
          info('minor       = {}'.format(os.environ['SR_MINOR']))
          info('patch       = {}'.format(os.environ['SR_PATCH']))
          info('notes ⏎\n{}'.format(os.environ['SR_NOTES']))

          action('consistency with the dry-run')
          assert_equality((
              (os.environ['SR_CHANNEL'], os.environ['SRDRY_CHANNEL']),
              (os.environ['SR_VERSION'], os.environ['SRDRY_VERSION']),
          ))
