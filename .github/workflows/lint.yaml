name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Check go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code

      - name: Check generated files
        run: |
          task manifests generate
          git diff --exit-code

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code

      - name: Check linter configuration
        run: task lint-config

      - name: Run lint
        run: task lint

      - name: Lint the Helm chart
        run: task helm-lint

      - name: Check the chart values
        run: task lint-values

      - name: Run markdownlint
        run: npx --yes --package markdownlint-cli2 --package markdownlint-rule-search-replace --package markdownlint-rule-relative-links markdownlint-cli2 "**/*.md"
