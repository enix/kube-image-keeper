name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      # Maintenance branches (X.Y.x): pushing one redeploys the site so the
      # version it backs (the site root for the latest stable line, /X.Y/ for
      # an older one, see website/versions.mjs) is refreshed. The
      # build always runs against main's website config (see the checkout ref
      # below). The pattern mirrors the maintenance-branch glob in
      # .releaserc.mjs; GitHub filter syntax can't express extglob, so this is
      # its closest equivalent.
      - "[0-9]*.x"
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yaml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yaml"
  # A manual run rebuilds and redeploys the site as main describes it, whatever
  # the branch it is started from.
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment, cancel in-progress runs in favor of new ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 fetches all branches/tags so the build can source the
          # docs of each version via `git archive <ref> docs` (see
          # website/versions.mjs and website/scripts/sync-docs.mjs).
          fetch-depth: 0
          # A deployed site is always built from main: its structure (website
          # config, versions list, the docs under /next/) comes from main, while
          # each maintenance branch is sourced via git archive. So a push to a
          # maintenance branch and a manual run check main out. Pull requests
          # use the default ref (empty string).
          ref: ${{ github.event_name != 'pull_request' && 'main' || '' }}

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          path: website
          node-version: 24

  deploy:
    needs: build
    # Allow the job to clone the repo and create a Pages deployment
    permissions:
      pages: write
      id-token: write
    # Deploy on pushes to main and to maintenance branches (X.Y.x) and on a
    # manual run; pull requests get build-only validation. The push filter
    # above already restricts pushes to those branches.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
