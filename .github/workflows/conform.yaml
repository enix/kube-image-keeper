name: Conform

on:
  pull_request:

permissions:
  contents: read

jobs:
  conform:
    # A distinct name: the main ruleset requires this check by name.
    name: Conform
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: ./.github/actions/setup-task

      # A review fix left as a fixup!, squash! or amend! commit would land as is: say how to
      # fold it, rather than let conform reject its subject with no hint.
      - name: Look for unfolded review fixes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GUIDE: ${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md#pull-requests
        run: |
          unfolded=$(git log --format=%s "origin/$BASE_REF..HEAD" | grep -E '^(fixup|squash|amend)! ' || true)
          if [ -n "$unfolded" ]; then
            printf '%s\n' "$unfolded"
            echo "::error::Fold the review fixes before the merge: git rebase -i --autosquash origin/$BASE_REF, then git push --force-with-lease. See $GUIDE"
            exit 1
          fi

      - name: Lint commits
        run: task conform BASE_BRANCH=origin/${{ github.event.pull_request.base.ref }}

      # The rules conform cannot express: no feat or fix in the tooling scopes, and the
      # Introduced-by line of every fix commit (the release notes read it).
      - name: Check the commit rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: sh hack/check-commit-rules.sh "origin/$BASE_REF"
