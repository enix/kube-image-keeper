name: Conform

on:
  pull_request:

permissions:
  contents: read

jobs:
  conform:
    # A distinct name: the main ruleset requires this check by name.
    name: Conform
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Lint commits
        run: task conform BASE_BRANCH=origin/${{ github.event.pull_request.base.ref }}

      # The rules conform cannot express: no feat or fix in the tooling scopes, and the
      # Introduced-by line of every fix commit (the release notes read it).
      # The script comes from the base branch: a PR cannot edit the check that judges it, and
      # a branch cut before the script landed (Dependabot, forks) is still checked. A base
      # without the script skips the check.
      - name: Check the commit rules
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          script="$RUNNER_TEMP/check-commit-rules.sh"
          if ! git show "origin/$BASE_REF:hack/check-commit-rules.sh" > "$script"; then
            echo "::notice::origin/$BASE_REF has no hack/check-commit-rules.sh; skipping the commit rules check."
            exit 0
          fi
          sh "$script" "origin/$BASE_REF"
