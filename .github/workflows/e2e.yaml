name: E2E

# The suite installs the chart on a throwaway Kind cluster, which takes minutes. It runs once
# the work has landed and before a release, not on every pull request; run it by hand on a
# branch when the chart, the manifests or the manager entrypoint change.
on:
  push:
    branches:
      - main
    # The suite builds the manager image, applies the CRDs and installs the chart. Anything
    # else landing on main cannot change its outcome. Paths are ignored by workflow_call and
    # workflow_dispatch, so a release still runs it whatever it carries.
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Dockerfile
      - Makefile
      - Taskfile.yaml
      - helm/**
      - config/crd/**
      - .github/workflows/e2e.yaml
      - .github/actions/setup-kind/**
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: ./.github/actions/setup-task

      - name: Setup Kind
        uses: ./.github/actions/setup-kind

      - name: Run the e2e suite
        run: task test-e2e
