name: E2E

# The suite installs the chart on a throwaway Kind cluster, which takes minutes. On a pull
# request it is a required check; when the PR changes a path the suite depends on, it is
# gated by the e2e-ready label, which the author adds once the PR is reviewed and its final
# e2e test commit is pushed (notes/0013). Until then, the E2E job runs under another name and
# the required E2E check stays "Expected", which blocks the merge without failing. It also
# runs once the work has landed and before a release.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    # No paths filter here: a required check whose workflow never triggers stays "Expected"
    # and blocks the merge for good. The changes job filters paths itself, see "Look for
    # relevant changes".
  push:
    branches:
      - main
    # The suite builds the manager image, applies the CRDs and installs the chart on a Kind
    # cluster created from its config. Anything else landing on main cannot change its outcome. Paths are ignored by workflow_call and
    # workflow_dispatch, so a release still runs it whatever it carries.
    # Keep in sync with the list of the "Look for relevant changes" step below.
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - Dockerfile
      - .dockerignore
      - Makefile
      - Taskfile.yaml
      - test/e2e/kind-config.yaml
      - test/e2e/values.yaml
      - helm/**
      - config/crd/**
      - .github/workflows/e2e.yaml
      - .github/actions/setup-kind/**
      - .github/actions/setup-task/**
  workflow_call:
  workflow_dispatch:

# One suite per pull request: a label and a push landing together would otherwise run 2.
# Other events get a group of their own, so a release or a main run is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Decides what the E2E job does: skip (a pull request that cannot affect the suite),
  # wait-label, wait-autosquash, or run. Any event but pull_request runs the suite; in a
  # workflow called by another, github.event_name is the caller's event.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Clone the code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          # HEAD is the merge commit, HEAD^1 the base branch and HEAD^2 the PR head: the full
          # history lists the PR's commits and diffs it against its base, with no token and no
          # extra permission.
          fetch-depth: 0
          persist-credentials: false

      # Checked first: a PR that cannot affect the suite needs neither the label nor an
      # autosquashed branch, and passes at once.
      # Keep the list in sync with the paths filter of the push trigger above: with
      # --glob-pathspecs, git reads the same patterns the same way. A git error counts as a
      # change, so the suite runs.
      - name: Look for relevant changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if git --glob-pathspecs diff --quiet HEAD^1 HEAD -- \
            '**/*.go' \
            go.mod \
            go.sum \
            Dockerfile \
            .dockerignore \
            Makefile \
            Taskfile.yaml \
            test/e2e/kind-config.yaml \
            test/e2e/values.yaml \
            'helm/**' \
            'config/crd/**' \
            .github/workflows/e2e.yaml \
            '.github/actions/setup-kind/**' \
            '.github/actions/setup-task/**'
          then
            echo "::notice::No change can affect the e2e suite; skipping it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The label comes before the autosquash. The suite runs once, on the branch as it will
      # merge: fixup! commits mean the review fixes are not squashed yet, and the autosquash
      # push would run it again (notes/0013).
      - name: Decide the state
        id: state
        env:
          EVENT: ${{ github.event_name }}
          RELEVANT: ${{ steps.changes.outputs.run }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-ready') }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            state=run
          elif [ "$RELEVANT" = false ]; then
            state=skip
          elif [ "$LABELED" != true ]; then
            state=wait-label
          else
            fixups=$(git log --format=%s HEAD^1..HEAD^2 | grep -E '^(fixup|squash|amend)! ' || true)
            if [ -n "$fixups" ]; then
              printf '%s\n' "$fixups"
              state=wait-autosquash
            else
              state=run
            fi
          fi
          echo "state=$state"
          echo "state=$state" >> "$GITHUB_OUTPUT"

  e2e:
    # The required check is named E2E. While the pull request waits, the job reports under
    # another name and succeeds, so E2E stays "Expected": the merge is blocked, nothing is
    # red. A job-level if would not do: a skipped job counts as passed for a required check.
    name: ${{ needs.changes.outputs.state == 'wait-label' && 'E2E waits for the e2e-ready label' || needs.changes.outputs.state == 'wait-autosquash' && 'E2E waits for the autosquash' || 'E2E' }}
    needs: changes
    # Not skipped when the changes job fails: a skipped E2E would pass the required check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The suite's own go test timeout is 20 minutes, on top of the image build and the Kind cluster.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      STATE: ${{ needs.changes.outputs.state }}
    steps:
      - name: Require the changes job
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The changes job did not succeed; E2E cannot tell whether the suite must run"
          exit 1

      - name: Wait for the e2e-ready label
        if: env.STATE == 'wait-label'
        env:
          GUIDE: ${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md#pull-requests
        run: echo "::notice::Add the e2e-ready label once the PR is reviewed and its e2e specs are pushed; E2E runs then. See $GUIDE"

      - name: Wait for the autosquash
        if: env.STATE == 'wait-autosquash'
        env:
          GUIDE: ${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md#pull-requests
        run: echo "::notice::Autosquash the fixup! commits and force-push; E2E runs on the result. See $GUIDE"

      - name: Clone the code
        if: env.STATE == 'run'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        if: env.STATE == 'run'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        if: env.STATE == 'run'
        uses: ./.github/actions/setup-task

      - name: Setup Kind
        if: env.STATE == 'run'
        uses: ./.github/actions/setup-kind

      - name: Set up Docker Buildx
        if: env.STATE == 'run'
        uses: docker/setup-buildx-action@v4

      # The image the suite would build itself (managerImage in test/e2e/e2e_suite_test.go, no
      # build arg as in task docker-build), its layers cached across runs; the suite only loads
      # it into Kind. The cache goes through the runtime token: no permission to add.
      - name: Build the manager image
        if: env.STATE == 'run'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: example.com/kube-image-keeper:v0.0.1
          # A single-manifest image, as a plain docker build gives: kind load handles it on any
          # image store.
          provenance: false
          cache-from: type=gha
          # A cache the GitHub service fails to store costs the next run time, never this one.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Run the e2e suite
        if: env.STATE == 'run'
        env:
          KUIK_E2E_SKIP_IMAGE_BUILD: 'true'
        run: task test-e2e
