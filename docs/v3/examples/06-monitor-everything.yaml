############
# v2       #
############
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterImageSetAvailability
metadata:
  name: all
spec:
  imageFilter:
    exclude:
      - registry.example.com/mirror/.+
    include:
      - .+
  unusedImageExpiry: 168h
---
############
# v3       #
############
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMonitor
metadata:
  name: all
spec:
  # The v2 imageFilter excluded `registry.example.com/mirror/.+` so that mirrored references would
  # not be monitored alongside the originals they replaced. v3 needs no counterpart: a monitor
  # tracks the *origin* reference of every container, read from `kuik.enix.io/original-images` for
  # pods the webhook rewrote, so a mirrored reference never entered its scope in the first place.
  # What remains below is a plain label opt-out, for workloads that should not be monitored at all
  podSelector:
    matchExpressions:
      - key: kuik-monitor-ignore
        operator: DoesNotExist
  unusedImageRetention: 168h
