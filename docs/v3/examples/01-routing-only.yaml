apiVersion: kuik.enix.io/v2alpha1
kind: ClusterImageRouter
metadata:
  name: docker-library
spec:
  alternatives:
  - prefix: public.ecr.aws/docker/library/
  - prefix: mirror.gcr.io/library/
  - prefix: docker.io/library/
---
