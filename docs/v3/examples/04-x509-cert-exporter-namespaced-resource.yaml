apiVersion: kuik.enix.io/v1alpha1
kind: ReplicatedImageSet
metadata:
  name: x509-certificate-exporter
  namespace: monitoring
spec:
  upstreams:
    - imageFilter:
        include:
          - /enix/x509-certificate-exporter:.+
      path: /enix/
      priority: 10
      registry: quay.io
    - imageFilter:
        include:
          - /enix/x509-certificate-exporter:.+
      path: /enix/
      priority: 20
      registry: ghcr.io
    - imageFilter:
        include:
          - /enix/x509-certificate-exporter:.+
      path: /enix/
      priority: 30
      registry: docker.io
---
