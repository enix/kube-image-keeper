apiVersion: kuik.enix.io/v1alpha1
kind: ClusterReplicatedImageSet
metadata:
  name: bitnami
spec:
  upstreams:
    - registry: docker.io
      priority: 9999
      imageFilter:
        include:
          - "/bitnami/.+"
      path: "/bitnami/"
    - registry: docker.io
      priority: 20
      imageFilter:
        include:
          - "/bitnamilegacy/.+"
        exclude:
          - "/bitnamilegacy/sealed-secrets.*:.+"
          - "/bitnamilegacy/charts-syncer:.+"
          - "/bitnamilegacy/minideb:.+"
      path: "/bitnamilegacy/"
    - registry: public.ecr.aws
      priority: 10
      imageFilter:
        include:
          - "/bitnami/.+"
      path: "/bitnami/"
---
