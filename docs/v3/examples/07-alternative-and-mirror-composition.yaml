# Unlike the other files here, this one is not a migration example: both sides are simply
# example 01 and example 05 installed in the same cluster, which is a realistic combination
# (a set of upstream alternatives for Docker Hub library images, plus a catch-all mirror).
#
# A pod with `image: nginx:1.27` (normalised to `docker.io/library/nginx:1.27`) matches both
# resources, so this file is the concrete case behind the "Candidate ordering across resources"
# section of spec.md: it derives the order v2 produced, then the order v3 produces and how the two
# differ.

############
# v2       #
############
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterReplicatedImageSet
metadata:
  name: docker-library
spec:
  upstreams:
    - imageFilter:
        include:
          - /docker/library/.+
      path: /docker/library/
      priority: 10
      registry: public.ecr.aws
    - imageFilter:
        include:
          - /library/[^/]+
      path: /library/
      priority: 20
      registry: mirror.gcr.io
    - imageFilter:
        include:
          - /library/[^/]+
      path: /library/
      priority: 30
      registry: docker.io
---
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterImageSetMirror
metadata:
  name: registry-global
spec:
  cleanup:
    enabled: true
    retention: 168h
  imageFilter:
    exclude:
      - .+/cloudnative-pg/(postgresql|cloudnative-pg):.+
    include:
      - .*
  mirrors:
    - credentialSecret:
        name: registry-global
        namespace: kuik-system
      path: /mirror
      registry: registry.example.com
  priority: -10
#
# v2 answer, mechanically derived from the two level priority system:
#
#   1. registry.example.com/mirror/docker/library/nginx:1.27   (CISM, priority -10)
#   2. registry.example.com/mirror/library/nginx:1.27          (CISM, priority -10)
#   3. docker.io/library/nginx:1.27                            (original, priority 0)
#   4. public.ecr.aws/docker/library/nginx:1.27                (CRIS, priority 0, upstream 10)
#   5. mirror.gcr.io/library/nginx:1.27                        (CRIS, priority 0, upstream 20)
#
# Three v2 behaviours produce that list, and each one is a decision v3 has to make again:
#
#   a. the CISM is a *transform over the candidate set*, not a single extra candidate: the mirror
#      is applied to every alternative already collected, so the ECR alternative contributes
#      `mirror/docker/library/...` and the Docker Hub ones contribute `mirror/library/...`.
#      That is where the two distinct entries 1 and 2 come from.
#   b. `priority: -10` on the CISM puts both mirror entries ahead of the original, and the CRIS
#      at priority 0 keeps its upstreams behind it.
#   c. entries are deduplicated by reference after sorting, which is why the Docker Hub upstream
#      (priority 30) disappears: it is the same reference as the original at entry 3.
#
# Note that entry 1 is a destination path that only exists if the mirror controller copied the
# image *from ECR*, which it decides on its own; the webhook probes it regardless.
---
############
# v3       #
############
apiVersion: kuik.enix.io/v1alpha1
kind: ImageAlternative
metadata:
  name: docker-library
spec:
  alternatives:
    - imagePrefix: public.ecr.aws/docker/library/
    - imagePrefix: mirror.gcr.io/library/
    - imagePrefix: docker.io/library/
---
apiVersion: kuik.enix.io/v1alpha1
kind: ImageMirror
metadata:
  name: registry-global
spec:
  rewritePolicy: Always
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: DoesNotExist
  destination:
    path: registry.example.com/mirror/
    push:
      auth:
        secretRef:
          name: registry-global
    pull:
      auth:
        secretRef:
          name: registry-pull-creds
  cleanup:
    enabled: true
    retention: 168h
#
# v3 answer, derived from "Candidate ordering across resources" in spec.md. `priority` is gone;
# the order comes from `rewritePolicy` plus a fixed kind order.
#
# A1. Candidate order for `docker.io/library/nginx:1.27`
#
#   Total order: Always mirrors, Always alternatives, the original, OnFailure alternatives,
#   OnFailure mirrors — lexicographic by CR name within a band. Here the mirror says `Always` so
#   it leads, and the ImageAlternative defaults to `OnFailure` so its entries follow the original:
#
#     1. registry.example.com/mirror/docker.io/library/nginx:1.27   ImageMirror, Always
#     2. docker.io/library/nginx:1.27                               the original, at the pivot
#     3. public.ecr.aws/docker/library/nginx:1.27                   OnFailure band, declared order
#     4. mirror.gcr.io/library/nginx:1.27
#
#   spec.md tabulates the four `rewritePolicy` combinations for these same two resources. With
#   `OnFailure` on the mirror it would sit last instead of first: the upstream alternatives are
#   canonical and fresh, so they are probed before the local copy, which stays the safety net.
#
#   Four candidates where v2 produced five: the mirror is *one* candidate built from the original
#   reference, not a transform applied to every alternative, so v2's second mirror entry
#   (`mirror/docker/library/…`, the mirror of the ECR alternative) has no v3 equivalent. That is
#   the deliberate cost of the simpler rule — see A2 for why it does not actually lose the
#   "Docker Hub is down at copy time" case.
#
#   No disambiguation is required: only two *competing `Always`* CRs raise `AmbiguousRewrite`, and
#   there is a single `Always` CR here. `excludeImagePrefixes: [docker.io/library/]` on the mirror
#   remains a reasonable optimisation (this repository already has upstream alternatives, so
#   mirroring it buys little), but it is a choice, not a fix for an ambiguity.
#
# A2. Which images the mirror copies
#
#   Only the original, and the destination repository is keyed on the original reference:
#
#     registry.example.com/mirror/docker.io/library/nginx:1.27
#
#   Never a second repository for the ECR alternative, so one source image is one destination
#   repository and `status.repositories` / the cleanup GC stay independent of webhook routing
#   decisions. If Docker Hub is unreachable at copy time and the image was never copied, the
#   controller may pull the bytes from any entry of a matching ImageAlternative and push them to that
#   same destination path — bounded storage, and the mirror still fills up during the outage.
#   Caveat: the copy can then hold a digest that differs from the Docker Hub tag, which
#   `driftPolicy: Warn`/`Sync` surfaces once Docker Hub is reachable again.
#
# A3. Credit in the annotations and statuses
#
#   Whichever candidate is retained names its own CR in `kuik.enix.io/rewritten-by`, and only that
#   CR counts the pod (in `pods.rewritten`, and in `activeFallbacks` for an ImageAlternative), so
#   the gauges stay disjoint between CRs and between kinds and sum consistently.
#   So if the mirror serves the pod: `rewritten-by: {"nginx":"ImageMirror/registry-global"}`,
#   `reason: {"nginx":"Always"}`, and the ImageAlternative does not count it.
#   Left to settle: whether `pods.tracked` ("pods this CR could apply to", which overlaps by
#   construction) is exempt from that disjointness or gets redefined — see the note in spec.md.
