############
# v2       #
############
apiVersion: kuik.enix.io/v1alpha1
kind: ClusterImageSetMirror
metadata:
  name: registry-global
spec:
  cleanup:
    enabled: true
    retention: 168h
  imageFilter:
    exclude:
      # Exclude images used by CNPG pods as this conflict with cnpg-operator
      - .+/cloudnative-pg/(postgresql|cloudnative-pg):.+
    include:
      - .*
  mirrors:
    - credentialSecret:
        name: registry-global
        namespace: kuik-system
      path: /mirror
      registry: registry.example.com
  priority: -10
---
#################
# adunand rev2  #
#################
apiVersion: kuik.enix.io/v2alpha1
kind: ClusterImageCopier
metadata:
  name: registry-global
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: DoesNotExist
  destination:
    registry: registry.example.com
    pathPrefix: /mirror
    auth:
      secretRef:
        name: registry-global
  cleanup:
    enabled: true
    retention: 168h
---
apiVersion: kuik.enix.io/v2alpha1
kind: ClusterImageRouter
metadata:
  name: registry-global
spec:
  rewritePolicy: Force
  alternatives:
    - copierRef: registry-global
      auth:
        secretRef:
          name: registry-pull-creds
---
#################
# adunand rev3  #
#################
apiVersion: kuik.enix.io/v2alpha1
kind: ImageMirror
metadata:
  name: registry-global
spec:
  rewritePolicy: Force
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: DoesNotExist
  destination:
    registry: registry.example.com
    pathPrefix: /mirror
    push:
      auth:
        secretRef:
          name: registry-global
    pull:
      auth:
        secretRef:
          name: registry-pull-creds
  cleanup:
    enabled: true
    retention: 168h
---
